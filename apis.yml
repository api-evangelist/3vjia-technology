apis:
- aid: 3vjia-technology:3vjia-technology-open-platform-api
  name: 3vjia Open Platform API
  description: The 3vjia (三维家) Open Platform API — 429 documented POST operations on open-gateway.3vjia.com
    covering account and single-sign-on management, design schemes, product and material libraries, quotation,
    store and factory orders, production batches, AIMES/MOS/DMS manufacturing data, floor plans and generative-AI
    image, video and model tasks. Authentication is OAuth 2.0 client_credentials against https://graph.3vjia.com/oauth/token
    using an appId/appKey issued after developer and application approval; tokens live 7200 seconds. Every
    operation is POST with Content-Type application/json;charset=utf-8 and returns the envelope {success,
    code, msg, data}.
  humanURL: https://dev.3vjia.com/v1/document
