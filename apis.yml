aid: 3vjia-technology
name: 3vjia Technology
description: 3vjia Technology (Guangdong Sanweijia Information Technology Co., Ltd. / 三维家, international
  brand AiHouse) is a Guangzhou-based home-furnishing industrial-software company founded in 2013 that
  runs a cloud 3D design and manufacturing platform for the interior-decoration and custom-furniture industry.
  Its products span 3D cloud design, AI Dream Home (AI梦想家), AI Light Design (AI轻设计), CAD and rendering
  engines, the DMS order-splitting system, the MOS/MCS manufacturing execution systems and the AIMES manufacturing
  platform, joining design, quotation, order placement, splitting and factory production into one chain.
  It operates a public Open Platform (dev.3vjia.com) whose gateway open-gateway.3vjia.com exposes 429
  documented POST operations covering accounts and SSO, design schemes, product/material libraries, quotation,
  orders, production batches, floor plans and generative AI, authenticated with OAuth 2.0 client credentials
  issued against graph.3vjia.com.
