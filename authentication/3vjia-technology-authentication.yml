schemes:
- name: oauth2ClientCredentials
  type: oauth2
  applies_to: all 429 documented operations on open-gateway.3vjia.com
  flows:
  - flow: clientCredentials
    tokenUrl: https://graph.3vjia.com/oauth/token
    request_content_type: application/x-www-form-urlencoded
    parameters:
      grant_type: client_credentials
      client_id: the application's appId
      client_secret: the application's appKey
    success_response: '{"access_token": "<token>", "expires_in": 7200}'
    error_response: '{"error": "invalid_client", "error_description": "invalid client_id and client_secret"}'
    scopes: 0
    scopes_note: >-
      No scopes are defined. The grant is all-or-nothing at the application level; authorisation is
      enforced by which operations the enterprise's contract enables, not by scope.
  token:
    ttl_seconds: 7200
    single_token_rule: >-
      Only ONE access_token is valid per application at a time — issuing a new one invalidates the
      previous one. The provider therefore requires an enterprise-wide central token service
      ("企业需搭建access_token的中控服务"), and warns that independent per-system fetches will conflict.
      The documentation also recommends exposing a passive refresh endpoint so a caller that observes
      an expiry can trigger a refresh rather than waiting for the timer.
    expiry_signal: 'code 1700200026 — 凭证已过期，请重新授权 (observed live on graph.3vjia.com, HTTP 200)'
  transport:
    current_gateway: >-
      https://open-gateway.3vjia.com — the token is presented as the gateway requires; an
      unauthenticated call returns HTTP 200 with {"code":100100002,"msg":"缺少访问凭证信息"}.
    legacy_gateway: 'https://open.3vjia.com/<path>?sysCode=external&access_token=<token> — token in the query string'
  credential_issuance:
    self_serve: false
    steps:
