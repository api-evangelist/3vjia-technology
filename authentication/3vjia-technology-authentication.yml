    - Wait for 3vjia approval
    - Register an application at https://dev.3vjia.com/manage/my-app/app-manage
    - Wait for approval; appId/appKey are then issued
  description: >-
    OAuth 2.0 client credentials. appId/appKey are issued after developer + application approval at
    https://dev.3vjia.com/manage/my-app/developer. Token TTL 7200s; re-requesting invalidates the
    previous token.
