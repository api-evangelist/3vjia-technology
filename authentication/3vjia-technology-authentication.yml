additional_mechanisms:
- name: SSO 联合单点登录 (federated single sign-on)
  type: signed redirect
  host: https://sso.3vjia.com/JointLogin/Index
  signature: MD5(userId + appId + time + appKey)
  timestamp: 10-digit Unix seconds, ±5 minutes tolerance
  parameters: [userid, appid, time, sign, redirect_uri]
  binding: >-
    An external user id is bound to a 3vjia account either in advance via the account-binding
    operations, or interactively by the designer on first sign-in.
  note: >-
    A separate mechanism from the API token, on a separate host, with a separate credential use of
    appKey. MD5 without a salt or HMAC construction is weak by modern standards; the ±5 minute
    window is the only replay bound.
  sources:
  - https://dev.3vjia.com/v1/document (SSO联合单点登录)
- name: 授权登录授权码 (authorization code for delegated login)
  type: temporary code
  operation: commonApiJoinAuthAuthorize
  ttl: ten minutes (十分钟内有效)
  note: >-
    Exchanges an enterprise user id for a short-lived code plus a token expiry, for opening a 3vjia
    application as a specific user.
- name: OSS upload signatures
  type: short-lived object-storage signature
  operations:
  - apiV1ModelOssGetUploadToken
  - apiV1TextureOssGetUploadToken
  - apiV1LineOssGetUploadToken
  - apiV1NjvrStsGetSign
  note: Direct-to-object-storage uploads are authorised by a separately issued, short-lived signature.
gaps:
- No scopes, so an application token carries the full contracted surface — no least privilege.
- No authorization-server metadata (RFC 8414) and no OIDC discovery document.
- No mutual TLS, no key rotation guidance, no published credential-revocation procedure.
- No sandbox or test credential; there is nowhere to exercise auth without a production application.
- Authentication failures return HTTP 200, so standard 401-driven token-refresh middleware will not fire.
