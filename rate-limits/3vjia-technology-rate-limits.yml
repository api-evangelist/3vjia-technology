  - constraint: single-token rule
    detail: >-
      Only one access_token is valid per application at a time — requesting a new one invalidates the
      previous one. The docs therefore REQUIRE an enterprise to run a central token service
      ("中控服务") rather than let each system fetch its own. Uncoordinated concurrent token requests
      will knock each other out.
