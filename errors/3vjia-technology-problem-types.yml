format: proprietary
rfc9457: false
summary: >-
  3vjia does NOT use RFC 9457 problem+json and does not signal failure with HTTP status codes on the
  business gateway. open-gateway.3vjia.com answers HTTP 200 with content-type application/json for
  success, for missing credentials AND for unrouted paths; the outcome lives entirely in the body
  envelope. An agent that branches on HTTP status will read every failure as a success.
envelope:
  shape: '{"success": <bool>, "code": <int>, "msg": <string>, "data": <object|null>}'
  legacy_shape: '{"success": <bool>, "errorCode": <int>, "errorMessage": <string>, "result": <object|null>}'
  note: >-
    The current gateway (open-gateway.3vjia.com) uses success/code/msg/data. The legacy gateway
    (open.3vjia.com) documents success/errorCode/errorMessage/result. Both appear in the published
    documentation; the legacy shape is what the older 接口规范 documents describe.
  success_indicator: success == true (code 0 on the current gateway)
