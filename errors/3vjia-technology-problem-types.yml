gaps:
- No consolidated error-code reference page is published; codes are scattered across per-operation docs.
- The 100xxxxxx gateway code family is not documented at all — it was recovered by probing.
- No RFC 9457 problem+json, no type URIs, no machine-readable error registry.
- Failures are HTTP 200, so retry/backoff middleware keyed on status codes will not fire.
