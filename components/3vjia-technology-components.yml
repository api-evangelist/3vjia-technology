summary: >-
  3vjia ships no JavaScript component library, no web components and no npm loader. Its client-side
  embedding story is REDIRECT-AND-IFRAME: a host application signs a redirect into a 3vjia application
  and the whole 3vjia surface (the 3D designer, DMS, a scheme viewer) runs inside it. That is a real
  embedded surface, so it is recorded here, but it is not a component SDK.
families:
- name: SSO embed (联合单点登录)
  kind: signed redirect / iframe host
  loader: none — a URL, not a library
  entry: https://sso.3vjia.com/JointLogin/Index
  parameters:
  - name: userid
    description: the host system's user id, bound to a 3vjia account
  - name: appid
    description: the approved application id
  - name: time
    description: 10-digit Unix timestamp, ±5 minutes tolerance
  - name: sign
    description: MD5(userId + appId + time + appKey)
  - name: redirect_uri
    description: URL-encoded target inside 3vjia, e.g. https://admin.3vjia.com/3DLoading?SchemeId=123456
  targets:
  - name: 3D 云设计 (3D Cloud Design)
    url: https://admin.3vjia.com/3DLoading
    deep_link_param: SchemeId
  binding: >-
    Accounts are bound either in advance through the account-binding operations
    (apiV1AccountbindingBindAccount) or interactively, once, the first time a designer signs in.
  sample_code_published: Java, C#, PHP (signature generation), inline in the documentation
