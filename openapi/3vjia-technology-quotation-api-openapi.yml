      x-documentation-category: 报价模块
      description: 报价JSON数据结构详情，请到【三维家工作台】-【报价管理】-【配置管理】-【接口配置】页面，按需配置结构和字段。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dataUrl:
                  type: string
                  description: 报价XML链接，schemeId、xmlContent、dataUrl有且只有1个不为空。
                schemeId:
                  type: string
                  description: 方案ID，schemeId、xmlContent、dataUrl有且只有1个不为空。
                solutionCode:
                  type: string
                  description: 报价方案Code，solutionId、solutionCode有且只有1个不为空。
                solutionId:
                  type: string
                  description: 报价方案ID，solutionId、solutionCode有且只有1个不为空。
                xmlContent:
                  type: string
                  description: 报价XML内容，schemeId、xmlContent、dataUrl有且只有1个不为空。
                orderCreateTime:
                  type: string
                  description: 下单时间，格式：yyyy-MM-dd HH:mm:ss，定制业务专用。
                placeType:
                  type: string
                  description: 下单类型，定制业务专用。
                userId:
                  type: string
                  description: 三维家用户ID，定制业务专用。
            example:
              dataUrl: ''
              orderCreateTime: ''
              schemeId: ''
              userId: ''
              solutionCode: ''
              placeType: ''
              solutionId: ''
              xmlContent: ''
