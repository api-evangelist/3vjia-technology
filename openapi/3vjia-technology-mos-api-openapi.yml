      summary: 获取订单部件列表接口
      tags:
      - MOS
      x-source-documentation: https://dev.3vjia.com/document?apiId=474672016889319472
      x-documentation-category: MOS系统 / 订单数据
      description: 获取订单部件列表，可以按照订单ID、订单号
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                orderNo:
                  type: string
                  description: 订单号，订单ID、订单号至少传1项，当orderRecordId为空时，orderNo有效，外协订单无法使用orderNo查询
                  examples:
                  - 63CG19120402
                orderRecordId:
                  type: string
                  description: 订单ID，店铺订单、工厂订单通用，同一订单的店铺订单、工厂订单的ID一致，订单ID、订单号至少传1项，当orderRecordId不为空时，将忽略orderNo
                  examples:
                  - F053521B72F34613BEAD2CC8B6279E75
            example:
              orderNo: 63CG19120402
              orderRecordId: F053521B72F34613BEAD2CC8B6279E75
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      createUser:
                        type: object
                        properties:
                          avatar:
                            type: string
                            description: 设计师头像
                          mobile:
                            type: string
                            description: 手机号码
                          name:
                            type: string
                            description: 姓名
                          nickName:
                            type: string
                            description: 昵称
                          outUserId:
                            type: string
                            description: 账号绑定的企业系统用户ID
                          userId:
                            type: string
                            description: 三维家用户ID
                          userName:
                            type: string
                            description: 三维家账号
                        description: 操作用户
                      diyOrderNo:
                        type: string
                        description: 自定义订单号
                      orderName:
                        type: string
                        description: 订单名称
                      orderNo:
                        type: string
                        description: 订单编号
                      orderPartList:
                        type: array
                        items:
                          type: object
                          properties:
                            actualLength:
                              type: object
                            actualWidth:
                              type: object
                            barcode:
                              type: string
                              description: 条码，板件或门板才有值
                            basicMaterial:
                              type: string
                              description: 板件基材
                            cabinetName:
                              type: string
                              description: 所属柜子名称
                            cabinetNo:
                              type: string
                              description: 柜体编号
                            cabinetPanelNo:
                              type: string
                              description: 部件在柜子内的编号，板件、门板才有值
                            category:
                              type: string
                              description: 部件类型，Board=板件，Door=门板，Metal=五金
                            craftMark:
                              type: string
                              description: 工艺备注
                            doorDirection:
                              type: string
                              description: 门板的开门方向
                            hasHorizontalHole:
                              type: string
                              description: 是否打孔0=不打孔1=打孔
                            isAccurate:
                              type: string
                              description: 是否异形,1=异形0=常规
                            length:
                              type: object
                            material:
                              type: string
                              description: 板件材质
                            num:
                              type: integer
                              format: int32
                              description: 数量，五金才有值
                            partId:
                              type: string
                              description: 部件ID,此字段每次请求时值都可能产生变化，建议每次调接口前先清除订单的历史数据
                            partName:
                              type: string
                              description: 部件名称
                            partNumber:
                              type: string
                              description: 部件编码
                            pkgNo:
                              type: string
                              description: 包号
                            roomName:
                              type: string
                              description: 所属空间名称
                            series:
                              type: string
                              description: 系列
                            spec:
                              type: string
                              description: 规格，五金才有值
                            standardCategory:
                              type: string
                              description: 板件标准生成类型（判别五金安装用）
                            thickness:
                              type: object
                            unit:
                              type: string
                              description: 单位，五金才有值
                            width:
                              type: object
                        description: 部件结构
                      orderRecordId:
                        type: string
                        description: 订单的通用ID，同一订单下店铺订单、工厂订单此值是相同的
              example:
                msg: ''
                code: 0
