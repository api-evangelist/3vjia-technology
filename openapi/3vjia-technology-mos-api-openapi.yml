  /api/v1/manufacturing/getOrder3dFileUrl:
    post:
      operationId: apiV1ManufacturingGetOrder3dFileUrl
      summary: 获取订单3D文件地址接口
      tags:
      - MOS
      x-source-documentation: https://dev.3vjia.com/document?apiId=474662783372329035
      x-documentation-category: MOS系统 / 订单数据
      description: 获取三维家生产订单的3D设计文件地址，3D审核文件地址，用于单点登录直接打开对应文件。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                orderNo:
                  type: string
                  description: 订单编号，orderRecordId和orderNo至少传一个，orderRecordId为空时orderNo有效
                  examples:
                  - EMS-63CG19120402
                orderRecordId:
                  type: string
                  description: 订单的通用ID，同一订单下店铺订单、工厂订单此值是相同的，orderRecordId和orderNo至少传一个，传了orderRecordId将忽略orderNo
                  examples:
                  - F053521B72F34613BEAD2CC8B6279E75
            example:
              orderNo: EMS-63CG19120402
              orderRecordId: F053521B72F34613BEAD2CC8B6279E75
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      orderCheckFileReadOnlyRedirectUrl:
                        type: string
                        description: 订单审核文件只读模式单点登录重定向地址
                        examples:
                        - https://admin.3vjia.com/3DLoading?IsRemoveFurniture=1&OpenModel=1&SaveModel=readOnly&SchemeId=50011044&DisOrderId=63210a45bae6406596e0f67743b02865&SubOrderId=70ab1ce72a9e4b809be4b4f43c504dd7
                      orderCheckFileRedirectUrl:
                        type: string
                        description: 订单审核文件单点登录重定向地址
                        examples:
                        - https://admin.3vjia.com/3DLoading?IsRemoveFurniture=1&OpenModel=2&SaveModel=Modify&SchemeId=50011044&DisOrderId=63210a45bae6406596e0f67743b02865&SubOrderId=70ab1ce72a9e4b809be4b4f43c504dd7
                      orderDesignFileRedirectUrl:
                        type: string
                        description: 订单设计文件单点登录重定向地址
                        examples:
                        - https://admin.3vjia.com/3DLoading?IsRemoveFurniture=1&OpenModel=1&SaveModel=readOnly&SchemeId=50011044&DisOrderId=63210a45bae6406596e0f67743b02865&SubOrderId=70ab1ce72a9e4b809be4b4f43c504dd7
                      orderName:
                        type: string
                        description: 订单名称
                        examples:
                        - 测试订单
                      orderNo:
                        type: string
                        description: 订单号
                        examples:
                        - EMS-3838YG2005051312
                      orderRecordId:
                        type: string
                        description: 订单ID
                        examples:
                        - 70ab1ce72a9e4b809be4b4f43c504dd7
              example:
                msg: 成功
                code: 0
                data:
                  orderNo: EMS-3838YG2005051312
