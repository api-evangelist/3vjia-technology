openapi: 3.2.0
info:
  title: 3vjia Open Platform MOS API
  version: '2026-09-05'
  summary: Home-furnishing 3D cloud design, quotation, order, manufacturing (AIMES/MOS/DMS) and AI operations exposed by the 3vjia (三维家) Open Platform.
  description: Machine-readable description of the 3vjia (三维家 / AiHouse) Open Platform, DERIVED — not published by the provider in this form.
  contact:
    name: 3vjia Open Platform
    url: https://dev.3vjia.com/
servers:
- url: https://open-gateway.3vjia.com
  description: 3vjia Open Platform gateway (current)
- url: https://open.3vjia.com
  description: Legacy open gateway — takes ?sysCode=external&access_token=
security:
- oauth2ClientCredentials: []
tags:
- name: MOS
  description: MOS系统
paths:
  /api/v1/manufacturing/confirmDisOrder:
    post:
      operationId: apiV1ManufacturingConfirmDisOrder
      summary: 订单拆单确认接口
      tags:
      - MOS
      x-source-documentation: https://dev.3vjia.com/document?apiId=474669617277665340
      x-documentation-category: MOS系统 / 订单管理
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                orderNo:
                  type: string
                  description: 订单号，订单ID、订单号至少传1项，当orderRecordId为空时，orderNo有效
                  examples:
                  - 63CG19120402
                orderRecordId:
                  type: string
                  description: 订单ID，店铺订单、工厂订单通用，同一订单的店铺订单、工厂订单的ID一致，订单ID、订单号至少传1项，当orderRecordId不为空时，将忽略orderNo
                  examples:
                  - F053521B72F34613BEAD2CC8B6279E75
                outUserId:
                  type: string
                  description: 操作人-企业账号绑定时使用的企业用户ID，userId、userName、outUserId三个中，outUserId优先级第三
                  examples:
                  - '123456'
                userId:
                  type: string
                  description: 操作人-三维家用户ID，userId、userName、outUserId三个中，userId优先级最高
                  examples:
                  - '1000122456'
                userName:
                  type: string
                  description: 操作人-三维家账号，userId、userName、outUserId三个中，userName优先级第二
                  examples:
                  - 3vj123456
            example:
              orderNo: 63CG19120402
              outUserId: '123456'
              userName: 3vj123456
              userId: '1000122456'
              orderRecordId: F053521B72F34613BEAD2CC8B6279E75
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
              example:
                msg: 成功
                code: 0
                data: true
                success: true
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/manufacturing/createOrderBatch:
    post:
      operationId: apiV1ManufacturingCreateOrderBatch
      summary: 生成批次接口
      tags:
      - MOS
      x-source-documentation: https://dev.3vjia.com/document?apiId=474672016889319474
      x-documentation-category: MOS系统 / 生产批次
      description: 指定订单进行生成批次
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                operatorOutUserId:
                  type: string
                  description: 操作生成批次的企业系统用户ID（需绑定过三维家账号），operatorUserId、operatorUserName、operatorOutUserId三项至少传一项，当operatorUserId、operatorUserName为空时，operatorOutUserId有效
                operatorUserId:
                  type: string
                  description: 操作生成批次的三维家用户ID，operatorUserId、operatorUserName、operatorOutUserId三项至少传一项，若传了operatorUserId，当忽略operatorUserName、operatorOutUserId字段
                operatorUserName:
                  type: string
                  description: 操作生成批次的三维家账号，operatorUserId、operatorUserName、operatorOutUserId三项至少传一项，当operatorUserId为空时，operatorUserName有效，传了operatorUserName将忽略operatorOutUserId字段
                orderNoList:
                  type: array
                  items: {}
                  description: 要生成批次的订单号列表，外协订单无法使用此字段，orderRecordIdList和orderNoList至少传一项，当orderRecordIdList为空时，此字段有效
                orderRecordIdList:
                  type: array
                  items: {}
                  description: 要生成批次的订单ID列表，orderRecordIdList和orderNoList至少传一项，当orderRecordIdList有值时会忽略orderNoList
            example:
              operatorOutUserId: ''
              operatorUserId: ''
              orderRecordIdList: []
              operatorUserName: ''
              orderNoList: []
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
              example:
                msg: 成功
                code: 0
                data: xxx
                success: true
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/manufacturing/getBatchOrderList:
    post:
      operationId: apiV1ManufacturingGetBatchOrderList
      summary: 获取已生成批次订单列表接口
      tags:
      - MOS
      x-source-documentation: https://dev.3vjia.com/document?apiId=475027993060782088
      x-documentation-category: MOS系统 / 生产批次
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                batchNo:
                  type: string
                  description: 批次号,batchNo和createBatchBeginTime不能同时为空
                  examples:
                  - 63-191210-235
                createBatchBeginTime:
                  type: string
                  description: 创建批次开始时间，格式yyyy-MM-ddHH:mm:ss,createBatchBeginTime和batchNo不能同时为空，createBatchBeginTime和createBatchEndTime时间差不能超过7天
                  examples:
                  - '2020-05-01 00:00:00'
                createBatchEndTime:
                  type: string
                  description: 创建批次结束时间，格式yyyy-MM-ddHH:mm:ss，当createBatchBeginTime有值时，有默认值为当前时间
                  examples:
                  - '2020-05-07 00:00:00'
            example:
              batchNo: 63-191210-235
              createBatchEndTime: '2020-05-07 00:00:00'
              createBatchBeginTime: '2020-05-01 00:00:00'
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      batchDate:
                        type: string
                        description: 生成批次的时间，格式yyyy-MM-ddHH:mm:ss
                      batchNo:
                        type: string
                        description: 批次号
                      consigneeAddress:
                        type: string
                        description: 收货地址
                      contactName:
                        type: string
                        description: 联系人
                      contactWay:
                        type: string
                        description: 联系方式
                      createBatchUser:
                        type: object
                        properties:
                          avatar:
                            type: string
                            description: 设计师头像
                          mobile:
                            type: string
                            description: 手机号码
                          name:
                            type: string
                            description: 姓名
                          nickName:
                            type: string
                            description: 昵称
                          outUserId:
                            type: string
                            description: 账号绑定的企业系统用户ID
                          userId:
                            type: string
                            description: 三维家用户ID
                          userName:
                            type: string
                            description: 三维家账号
                        description: 操作用户
                      customer:
                        type: object
                        properties:
                          customerAddress:
                            type: string
                            description: 客户地址
                          customerCode:
                            type: string
                            description: 客户编码
                          customerId:
                            type: string
                            description: 客户ID
                          customerMobile:
                            type: string
                            description: 客户手机
                          customerName:
                            type: string
                            description: 客户名称
                        description: 客户信息
                      deliveryDate:
                        type: string
                        description: 发货日期，格式yyyy-MM-dd
                      diyOrderNo:
                        type: string
                        description: 自定义订单号
                      factoryOrgan:
                        type: object
                        properties:
                          organId:
                            type: string
                            description: 企业ID
                          organName:
                            type: string
                            description: 企业名称
                        description: 部门所属机构信息
                      mainColor:
                        type: string
                        description: 主材颜色
                      orderName:
                        type: string
                        description: 订单名称
                      orderNo:
                        type: string
                        description: 订单号
                      orderRecordId:
                        type: string
                        description: 订单ID
                      orderType:
                        type: string
                        description: 订单类型（衣柜、橱柜、系统柜...）
                      orderVersion:
                        type: string
                        description: 订单版本号
                      partVersion:
                        type: string
                        description: 拆单版本号
                      remark:
                        type: string
                        description: 备注
                      shopDept:
                        type: object
                        properties:
                          customerCode:
                            type: string
                            description: 部门对应客户部门编码
                          deptId:
                            type: string
                            description: 部门ID
                          deptName:
                            type: string
                            description: 部门名称
                          outDeptId:
                            type: string
                            description: 部门所绑定企业系统部门ID，绑定过才有值
                          storeType:
                            type: integer
                            format: int32
                            description: 类型0=门店，1=部门
                        description: 上级部门信息
                      shopOrgan:
                        type: object
                        properties:
                          organId:
                            type: string
                            description: 企业ID
                          organName:
                            type: string
                            description: 企业名称
                        description: 部门所属机构信息
              example:
                msg: ''
                code: 0
                data:
                - orderType: ''
                  batchNo: ''
                  shopOrgan:
                    organName: ''
                    organId: ''
                  orderNo: ''
                  contactName: ''
                  batchDate: ''
                  remark: ''
                  orderVersion: ''
                  factoryOrgan:
                    organName: ''
                    organId: ''
                  diyOrderNo: ''
                  orderRecordId: ''
                  partVersion: ''
                  mainColor: ''
                  shopDept:
                    deptName: ''
                    storeType: 0
                    deptId: ''
                    customerCode: ''
                    outDeptId: ''
                  contactWay: ''
                  deliveryDate: ''
                  createBatchUser:
                    nickName: ''
                    mobile: ''
                    avatar: ''
                    outUserId: ''
                    userName: ''
                    userId: ''
                    name: ''
                  consigneeAddress: ''
                  customer:
                    customerAddress: ''
                    customerCode: ''
                    customerName: ''
                    customerId: ''
                    customerMobile: ''
                  orderName: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/manufacturing/getBatchProductionXml:
