        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/manufacturing/getFactorySupplementOrderListByPage:
    post:
      operationId: apiV1ManufacturingGetFactorySupplementOrderListByPage
      summary: 获取工厂补单列表接口
      tags:
      - MOS
      x-source-documentation: https://dev.3vjia.com/document?apiId=475006971230105648
      x-documentation-category: MOS系统 / 订单数据
      description: 分页获取门店补单列表
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                createBeginTime:
                  type: string
                  description: 订单创建开始时间，格式yyyy-MM-ddHH:mm:ss
                createEndTime:
                  type: string
                  description: 订单创建结束时间，格式yyyy-MM-ddHH:mm:ss，当createBeginTime有值时，此值有默认值为当前时间
                customerInfo:
                  type: string
                  description: 客户信息
                orderNo:
                  type: string
                  description: 补单号
                pageIndex:
                  type: integer
                  format: int32
                  description: 页码，最小值为1，默认值为1
                pageSize:
                  type: integer
                  format: int32
                  description: 分页大小，最小值1，最大值500，默认值50
            example:
              createBeginTime: ''
              orderNo: ''
              customerInfo: ''
              pageSize: 0
              pageIndex: 0
              createEndTime: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      pageIndex:
                        type: integer
                        format: int32
                      pageSize:
                        type: integer
                        format: int32
                      recordCount:
                        type: integer
                        format: int32
                      result:
                        type: array
                        items:
                          type: object
                          properties:
                            createTime:
                              type: string
                              description: 订单创建开始时间，格式yyyy-MM-ddHH:mm:ss
                            createUser:
                              type: string
                              description: 创建订单用户
                            factoryStateName:
                              type: string
                              description: 工厂订单状态名称
                            factoryStatus:
                              type: string
                              description: 工厂订单状态值
                            orderName:
                              type: string
                              description: 补单名称
                            orderNo:
                              type: string
                              description: 补单编号
                            recordId:
                              type: string
                              description: 补单ID
                            shopStateName:
                              type: string
                              description: 门店订单状态名称
                            shopStatus:
                              type: string
                              description: 门店订单状态值
                        description: 获取补单信息返参
              example:
                msg: ''
                code: 0
                data:
                  recordCount: 0
                  pageSize: 0
                  result:
                  - orderNo: ''
                    factoryStateName: ''
                    shopStateName: ''
                    factoryStatus: ''
                    recordId: ''
                    shopStatus: ''
                    createTime: ''
                    createUser: ''
                    orderName: ''
                  pageIndex: 0
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/manufacturing/getManufacturingOrderPartList:
