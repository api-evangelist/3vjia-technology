      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audioUrls:
                  type: array
                  items: {}
                  description: 参考音频url列表，仅 seedance-2 / seedance-2-fast 支持。1. 该字段用于多模态参考生视频，提交后会按 reference_audio 发送给上游。2. 不可单独传入，至少需要配合 1 张参考图片或 1 个参考视频。3. 不可与首帧/首尾帧场景混用。格式：wav、mp3。单个音频时长：[2, 15] s，最多传入 3 段参考音频，所有音频总时长不超过 15 s。大小：单个音频不超过 15 MB，请求体大小不超过 64 MB。
                camerafixed:
                  type: boolean
                  description: '是否固定摄像头, 为true时， 平台会在用户提示词中追加固定摄像头，实际效果不保证。有参考视频的时候不可支持固定摄像头。 默认值: false'
                durationSecs:
                  type: integer
                  format: int32
                  description: 视频时长，单位秒。当前接口透传给豆包视频生成接口，常用可选值 2~15 秒；不同模型的实际上限以下游模型能力为准。
                executionExpiresAfter:
                  type: integer
                  format: int32
                  description: '执行过期时间，单位秒，仅当offline为true时生效。 默认值: 28800'
                fps:
                  type: integer
                  format: int32
                  description: 帧率, 默认值:24
                generateAudio:
                  type: boolean
                  description: 是否生成有声视频，默认值:false。该参数表示是否让模型产出带音轨视频；与 audioUrls 作为参考音频输入不是同一个概念。
                imageUrl:
                  type: string
                  description: '首图url。1. 文生视频场景可不传。2. 首帧生视频/首尾帧生视频场景下，表示首帧图片。3. 当reference=true，或同时传入videoUrls/audioUrls时，表示参考图之一。4. 多模态参考生视频、首帧生视频、首尾帧生视频是互斥场景，不可混用。支持格式: JPEG(JPG)、PNG、WEBP、BMP、TIFF、GIF；宽高比: (0.4,2.5)；边长: [300,6000] px；大小: 小于30MB。'
                keyFrames:
                  type: array
                  items: {}
                  description: '关键帧/参考图url列表。1. reference=false 且传入时，当前仅取第1张作为尾帧，用于首尾帧生视频。2. reference=true 时，全部作为参考图使用；配合imageUrl时，imageUrl也会作为参考图一并提交。3. seedance-2/seedance-2-fast 多模态参考生视频下，也可作为参考图输入，最多 9 张。4. 多模态参考生视频、首帧生视频、首尾帧生视频互斥，不可混用。支持格式: JPEG(JPG)、PNG、WEBP、BMP、TIFF、GIF；宽高比: (0.4,2.5)；边长: [300,6000] px；大小: 小于30MB。'
                modelCode:
                  type: string
                  description: 模型,目前支持：v_d_t_1=seedance-lite-t2v；v_d_i_1=seedance-lite-i2v；v_d_1=seedance-pro；v_d_15=seedance-1.5-pro；v_d_2=seedance-2；v_d_2_fast=seedance-2-fast
                offline:
                  type: boolean
                  description: '是否离线模式, 当业务允许小时级别的延迟的话，建议使用离线模式， 价格打5折。 默认值: false'
                promptText:
                  type: string
                  description: 提示语，可选。中文不超 500 字，英文不超 1000 字。多张参考图场景建议使用“[图1]... [图2]...”方式描述，便于模型对齐具体参考素材。
                ratio:
                  type: string
                  description: 视频比例，请传字符串枚举名称，可选值：DEFAULT=adaptive、R_21_9=21:9、R_16_9=16:9、R_4_3=4:3、R_1_1=1:1、R_3_4=3:4、R_9_16=9:16、R_9_21=9:21。
                reference:
                  type: boolean
                  description: 是否使用参考图，默认值:false。1. false：imageUrl 视为首帧，keyFrames 第1张视为尾帧。2. true：imageUrl 与 keyFrames 全部按参考图处理。3. 当传入 videoUrls 或 audioUrls 时，会进入多模态参考生视频场景，此时图片也会按参考图处理。
                resolution:
                  type: string
                  description: 视频分辨率，请传字符串枚举名称，可选值：P480=480p、P720=720p、P1080=1080p；默认值P720。
                seed:
                  type: integer
                  format: int64
                  description: 随机种子
                videoUrls:
                  type: array
                  items: {}
                  description: 参考视频url列表，仅 seedance-2 / seedance-2-fast 支持。1. 该字段用于多模态参考生视频，提交后会按 reference_video 发送给上游。2. 可与参考图、提示词、参考音频组合使用。3. 不可与首帧/首尾帧场景混用。4. 最多传入 3 个参考视频，所有视频总时长不超过 15s。视频格式：mp4、mov。分辨率：480p、720p。单个视频时长：[2, 15] s。宽高比（宽/高）：[0.4, 2.5]。宽高长度（px）：[300, 6000]。总像素数：[409600, 927408]。大小：单个视频不超过 50 MB。帧率(FPS)：[24, 60]。
              required:
              - modelCode
              - ratio
            example:
              audioUrls: []
              seed: 0
              fps: 0
              videoUrls: []
              resolution: ''
              executionExpiresAfter: 0
              generateAudio: false
              keyFrames: []
              reference: false
              offline: false
              durationSecs: 0
              camerafixed: false
              modelCode: ''
              imageUrl: ''
              promptText: ''
              ratio: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      failure:
                        type: string
                        description: 失败原因
                      failureCode:
                        type: string
                        description: 错误码
                      lastFrameUrl:
                        type: string
                        description: 最后一帧图片地址
                      msg:
                        type: string
                        description: 任务状态描述
                      progress:
