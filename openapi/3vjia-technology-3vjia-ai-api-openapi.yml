openapi: 3.2.0
info:
  title: 3vjia Open Platform 3vjia AI API
  version: '2026-09-05'
  summary: Home-furnishing 3D cloud design, quotation, order, manufacturing (AIMES/MOS/DMS) and AI operations exposed by the 3vjia (三维家) Open Platform.
  description: Machine-readable description of the 3vjia (三维家 / AiHouse) Open Platform, DERIVED — not published by the provider in this form.
  contact:
    name: 3vjia Open Platform
    url: https://dev.3vjia.com/
servers:
- url: https://open-gateway.3vjia.com
  description: 3vjia Open Platform gateway (current)
- url: https://open.3vjia.com
  description: Legacy open gateway — takes ?sysCode=external&access_token=
security:
- oauth2ClientCredentials: []
tags:
- name: 3vjia AI
  description: 三维家AI
paths:
  /api/v1/aiImage/createImage:
    post:
      operationId: apiV1AiImageCreateImage
      summary: AI生图接口
      tags:
      - 3vjia AI
      x-source-documentation: https://dev.3vjia.com/document?apiId=844311885481394218
      x-documentation-category: 三维家AI / 图片生成
      description: '该接口为异步接口，调用成功后会先返回任务信息，图片生成完成后可再通过异步任务查询接口获取最终结果。


        当前支持以下模型：


        - `ai_image_3_0`：(三维家)AI改图3.0

        - `i_g_2_pro`：gemini-2.5-flash-image

        - `i_g_3_pre`：gemini-3-pro-image-preview

        - `i_g_31_pre`：gemini-3.1-flash-image-preview

        - `i_o_1`：gpt-image-1

        - `i_o_1_pro`：gpt-image-1.5

        - `i_o_2`：gpt-image-2

        - `i_d_4`：seedream-v4

        - `i_d_4_pro`：seedream-v4.5

        - `i_d_5_lite`：seedream-v5-lite

        - `i_d_5_lite`：seedream-v5-lite

        - `seedream-v5`：doubao-seedream-5-0-pro-260628

        - `i_j_4`：jimeng-v4

        - `i_b_1`：baidu


        接口的详细对接说明查看：https://help.3vjia.com/doc/aigc-open/832612605813211232/844307490291204140'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                extImageUrls:
                  type: array
                  items: {}
                  description: 其他参考图片链接列表，支持普通图片 URL，也支持标准 data URL
                extraParam:
                  type: object
                  description: 额外参数。size 支持：512、1K、2K、4K；aspectRatio 支持：1:1、1:4、1:8、2:3、3:2、3:4、4:1、4:3、4:5、5:4、8:1、9:16、16:9、21:9
                imageNumber:
                  type: integer
                  format: int32
                  description: 出图张数，默认 1
                imageUrl:
                  type: string
                  description: 初始图片链接，支持普通图片 URL，也支持标准 data URL
                model:
                  type: string
                  description: 模型英文编码，支持：ai_image_3_0（AI改图3.0）、i_g_2_pro、i_g_3_pre、i_g_31_pre、i_o_1、i_o_1_pro、i_o_2、i_d_4、i_d_4_pro、i_d_5_lite、seedream-v5、i_j_4、i_b_1
                prompt:
                  type: string
                  description: 用于生成图像的提示词，中英文均可输入
                seed:
                  type: integer
                  format: int64
                  description: 相同的 seed 能让结果更稳定
              required:
              - model
              - prompt
            example:
              seed: 0
              imageNumber: 0
              extraParam: ''
              extImageUrls: []
              imageUrl: ''
              model: ''
              prompt: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      consumeQuantity:
                        type: number
                        format: bigdecimal
                        description: 消耗创点数量
                      failure:
                        type: string
                        description: 失败原因
                      failureCode:
                        type: string
                        description: 错误码
                      imageUrl:
                        type: string
                        description: 图片地址
                      msg:
                        type: string
                        description: 任务状态描述
                      progress:
                        type: number
                        format: float
                        description: 进度, 当状态为RUNNING时有值, 取值范围[0, 1]之间
                      remainingPersonQuantity:
                        type: number
                        format: bigdecimal
                        description: 个人剩余数量
                      remainingShopQuantity:
                        type: number
                        format: bigdecimal
                        description: 门店剩余数量（共享情况下会返回）
                      remainingTenantQuantity:
                        type: number
                        format: bigdecimal
                        description: 租户剩余数量（共享情况下会返回）
                      status:
                        type: string
                        description: 任务状态. -1:未知或者任务不存在, 1:排队中, 2:生成中, 3:生成成功, 4:生成失败, 5:已取消
                      taskId:
                        type: string
                        description: 任务ID
                      recordTransactionId:
                        type: string
                        description: 创点消费流水号
              example:
                msg: ''
                code: 0
                data:
                  msg: ''
                  failureCode: ''
                  recordTransactionId: ''
                  remainingShopQuantity: 0
                  consumeQuantity: 0
                  remainingTenantQuantity: 0
                  remainingPersonQuantity: 0
                  failure: ''
                  imageUrl: ''
                  progress: 0
                  taskId: ''
                  status: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/aiImage/render/createImage:
    post:
      operationId: apiV1AiImageRenderCreateImage
      summary: AI渲染生图接口
      tags:
      - 3vjia AI
      x-source-documentation: https://dev.3vjia.com/document?apiId=853284784322023452
      x-documentation-category: 三维家AI / 图片生成
      description: 该接口为异步接口，提交成功后返回任务信息，图片生成完成后可通过异步任务查询接口获取最终结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                extra:
                  type: object
                  description: 额外参数，按任务类型透传给下游
                  examples:
                  - '{}'
                initImage:
                  type: string
                  description: 漫反图 URL
                prompt:
                  type: string
                  description: 出图语义
                taskType:
                  type: string
                  description: 任务类型
              required:
              - initImage
              - taskType
            example:
              initImage: ''
              taskType: ''
              extra: ''
              prompt: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      consumeQuantity:
                        type: number
                        format: bigdecimal
                        description: 消耗创点数量
                      failure:
                        type: string
                        description: 失败原因
                      failureCode:
                        type: string
                        description: 错误码
                      imageUrl:
                        type: string
                        description: 图片地址
                      msg:
                        type: string
                        description: 任务状态描述
                      progress:
                        type: number
                        format: float
                        description: 进度, 当状态为RUNNING时有值, 取值范围[0, 1]之间
                      remainingPersonQuantity:
                        type: number
                        format: bigdecimal
                        description: 个人剩余数量
                      remainingShopQuantity:
                        type: number
                        format: bigdecimal
                        description: 门店剩余数量（共享情况下会返回）
                      remainingTenantQuantity:
                        type: number
                        format: bigdecimal
                        description: 租户剩余数量（共享情况下会返回）
                      status:
                        type: string
                        description: 任务状态. -1:未知或者任务不存在, 1:排队中, 2:生成中, 3:生成成功, 4:生成失败, 5:已取消
                      taskId:
                        type: string
                        description: 任务ID
                      recordTransactionId:
                        type: string
                        description: 创点消费流水号
              example:
                msg: ''
                code: 0
                data:
                  msg: ''
                  failureCode: ''
                  recordTransactionId: ''
                  remainingShopQuantity: 0
                  consumeQuantity: 0
                  remainingTenantQuantity: 0
                  remainingPersonQuantity: 0
                  failure: ''
                  imageUrl: ''
                  progress: 0
                  taskId: ''
                  status: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/aiModel/create:
    post:
      operationId: apiV1AiModelCreate
      summary: 提交AI生模任务
      tags:
      - 3vjia AI
      x-source-documentation: https://dev.3vjia.com/document?apiId=882346505367887926
      x-documentation-category: 三维家AI / 图生模
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                genModelMainImg:
                  type: boolean
                  description: 是否生成模型主图
                genTopDownViewImage:
                  type: boolean
                  description: 是否生成正交俯视图
                imageUrl:
                  type: string
                  description: 主图片地址；imageUrl和prompt至少传一个，同时传时优先使用imageUrl
                intoDesign:
                  type: boolean
                  description: 是否入库；为true时materialConf必填
                materialConf:
                  type: object
                  properties:
                    belongSource:
                      type: integer
                      format: int32
                      description: 素材来源。0-个人，1-门店，2-企业
                    categoryId:
                      type: integer
                      format: int64
                      description: 分类ID
                    materialName:
                      type: string
                      description: 入库素材名称
                    picHeight:
                      type: number
                      format: double
                      description: 入库素材高度，单位毫米
                    picLength:
                      type: number
                      format: double
                      description: 入库素材长度，单位毫米
                    picWidth:
                      type: number
                      format: double
                      description: 入库素材宽度，单位毫米
                    resetImagePath:
                      type: boolean
                      description: 是否将素材主图设置为白底图。默认为True
                  description: 入库素材参数，字段同3D云设计素材表
                modelConf:
                  type: object
                  properties:
                    faceNum:
                      type: integer
                      format: int32
                      description: 模型面数。不填则走系统默认配置
                    rmbg:
                      type: boolean
                      description: 是否去除背景，默认是
                    seed:
                      type: integer
                      format: int32
                      description: 模型种子。不同种子生成的效果会不同。默认42
                    segment:
                      type: boolean
                      description: 是否在生模完成后进行部件拆分。目前由ModelSegmentScheduler处理，支持TRIPO_31、自研SWJ拆分
                    segmentModel:
                      type: string
                      description: 部件拆分模型。可选值：SWJ、TRIPO。不填且segment为true时，使用系统配置默认值
                  description: 模型参数
                modelEnum:
                  type: string
                  description: 生模模型，modelEnum：生模模型枚举，当前支持以下取值： TRELLIS_2：对应创点中心模型 Trellis2，用于根据图片或文本生成 3D 模型。 TRIPO_31：对应创点中心模型 Tripo3D-3.1，modelConf.segment 不传或传 false 时使用。 TRIPO_31：当 modelConf.segment=true 时，对应创点中心模型 Tripo3D-3.1-seg，用于生成模型并进行部件拆分。 注意：Tripo3D-3.1 和 Tripo3D-3.1-seg 使用相同的 modelEnum=TRIPO_31，通过 modelConf.segment 参数区分
                modelPriority:
                  type: integer
                  format: int32
                  description: 模型生成优先级，0到10，默认5
                multiView:
                  type: array
                  items:
                    type: object
                    properties:
                      viewImageUrl:
                        type: string
                        description: 视角图片Url地址。支持jpg或png。单边分辨率小于5000且大于128。编码后大小不可超过8M<br/><font color='red'>【如果是oss地址，建议对url加上resize参数再传】</font>
                      viewType:
                        type: string
                        description: 视角类型<br/><table border='1'><thead><tr><th>枚举值</th><th>说明</th></tr></thead><tbody><tr><td>LEFT</td><td>左视图</td></tr><tr><td>RIGHT</td><td>右视图</td></tr><tr><td>BACK</td><td>后视图</td></tr><tr><td>TOP</td><td>顶视图（仅混元3.1版本支持）</td></tr><tr><td>BOTTOM</td><td>底视图（仅混元3.1版本支持）</td></tr><tr><td>LEFT_FRONT</td><td>左前45°视图（仅混元3.1版本支持）</td></tr><tr><td>RIGHT_FRONT</td><td>右前45°视图（仅混元3.1版本支持）</td></tr></tbody></table>
                  description: 混元图生3D多视角请求
                prompt:
                  type: string
                  description: 文本提示词，imageUrl为空时用于文生3D
                sourceId:
                  type: string
                  description: 调用方业务关联ID
                type:
                  type: string
                  description: 调用方业务标识
              required:
              - modelEnum
              - type
            example:
              sourceId: ''
              genTopDownViewImage: false
              modelEnum: ''
              modelPriority: 0
              type: ''
              genModelMainImg: false
              modelConf:
                seed: 0
                segmentModel: ''
                faceNum: 0
                rmbg: false
                segment: false
              multiView:
              - viewImageUrl: ''
                viewType: ''
              intoDesign: false
              materialConf:
                picWidth: 0
                picHeight: 0
                belongSource: 0
                resetImagePath: false
                materialName: ''
                picLength: 0
                categoryId: 0
              imageUrl: ''
              prompt: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      consumeQuantity:
                        type: number
                        format: bigdecimal
                        description: 本次预扣创点数量
                      recordTransactionId:
                        type: string
                        description: 创点消费流水号
                      remainingPersonQuantity:
                        type: number
                        format: bigdecimal
                        description: 个人剩余数量
                      remainingShopQuantity:
                        type: number
                        format: bigdecimal
                        description: 门店剩余数量（共享情况下会返回）
                      remainingTenantQuantity:
                        type: number
                        format: bigdecimal
                        description: 租户剩余数量（共享情况下会返回）
                      taskId:
                        type: string
                        description: 任务ID，后续通过结果查询接口获取任务状态和模型地址
              example:
                msg: ''
                code: 0
                data:
                  recordTransactionId: ''
                  remainingShopQuantity: 0
                  consumeQuantity: 0
                  remainingTenantQuantity: 0
                  remainingPersonQuantity: 0
                  taskId: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/aiModel/result:
    post:
      operationId: apiV1AiModelResult
      summary: 查询AI生模任务结果
      tags:
      - 3vjia AI
      x-source-documentation: https://dev.3vjia.com/document?apiId=882347917220946004
      x-documentation-category: 三维家AI / 图生模
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId:
                  type: string
                  description: 任务ID
              required:
              - taskId
            example:
              taskId: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      failInfo:
                        type: string
                        description: 失败信息
                      genModelMainImg:
                        type: boolean
                        description: 是否生成模型主图
                      genTopDownViewImage:
                        type: boolean
                        description: 是否生成俯视图
                      materialId:
                        type: string
                        description: 入库素材ID
                      materialTime:
                        type: string
                        format: date-time
                        description: 素材入库完成时间
                      modelMainImgUrl:
                        type: string
                        description: 模型主图地址
                      modelStatus:
                        type: integer
                        format: int32
                        description: 生模业务状态，0-新增/等待处理，1-等待生模，2-模型生成中，3-模型生成完成，-1-已取消或过滤不通过，-2-模型生成失败，4-素材入库中，-4-提交入库失败，5-素材入库成功，-5-素材入库失败，6-获取俯视图成功，-6-获取俯视图失败。
                      modelTime:
                        type: string
                        format: date-time
                        description: 模型生成时间
                      modelUrl:
                        type: string
                        description: 模型地址
                      queueId:
                        type: string
                        description: 入库队列ID
                      queueTime:
                        type: string
                        format: date-time
                        description: 进入入库队列时间
                      resizeFinish:
                        type: boolean
                        description: 是否完成素材参数配置
                      segmentFinishTime:
                        type: string
                        format: date-time
                        description: 部件拆分完成时间
                      segmentModelUrl:
                        type: string
                        description: 部件拆分后的模型地址
                      segmentStatus:
                        type: integer
                        format: int32
                        description: 部件拆分状态：0待提交，1排队中，2处理中，3完成，-2失败
                      sourceId:
                        type: string
                        description: 调用方业务关联ID
                      taskId:
                        type: string
                        description: 任务ID
                      taskStatus:
                        type: integer
                        format: int32
                        description: 统一任务状态：0初始化，1排队中，2执行中，3成功，4失败
                      topDownViewImage:
                        type: string
                        description: 俯视图地址
                      type:
                        type: string
                        description: 调用方业务标识
              example:
                msg: ''
                code: 0
                data:
                  sourceId: ''
                  queueId: ''
                  segmentStatus: 0
                  genTopDownViewImage: false
                  modelStatus: 0
                  modelMainImgUrl: ''
                  materialId: ''
                  type: ''
                  genModelMainImg: false
                  queueTime: ''
                  materialTime: ''
                  topDownViewImage: ''
                  segmentModelUrl: ''
                  failInfo: ''
                  modelUrl: ''
                  segmentFinishTime: ''
                  modelTime: ''
                  taskId: ''
                  taskStatus: 0
                  resizeFinish: false
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/aigc/2d3dNatural:
    post:
      operationId: apiV1Aigc2d3dNatural
      summary: AI渲染
      tags:
      - 3vjia AI
      x-source-documentation: https://dev.3vjia.com/document?apiId=648937765865668656
      x-documentation-category: 三维家AI / 空间AI
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                batchCount:
                  type: integer
                  format: int32
                  description: 出图张数
                  default: '4'
                height:
                  type: integer
                  format: int32
                  description: 分辨率，高度
                initImagePath:
                  type: string
                  description: 初始图片路径（2d图片）
                prompt:
                  type: string
                  description: 出图语义
                similarStr:
                  type: number
                  format: float
                  description: 相似度，如果风格图参数不为空，可调整与风格图的相似度，值为0.6-1之间
                styleImagePath:
                  type: string
                  description: 风格图路径，可根据风格图渲染出相似风格的结果图
                width:
                  type: integer
                  format: int32
                  description: 分辨率，宽度
            example:
              styleImagePath: ''
              batchCount: 0
              initImagePath: ''
              similarStr: 0
              width: 0
              prompt: ''
              height: 0
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      info:
                        type: string
                        description: 生成信息
                      taskId:
                        type: string
                        description: 任务ID
              example:
                msg: ''
                code: 0
                data:
                  taskId: ''
                  info: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/aigc/fillCleanRoom:
    post:
      operationId: apiV1AigcFillCleanRoom
      summary: 空间填充（旧改翻新）
      tags:
      - 3vjia AI
      x-source-documentation: https://dev.3vjia.com/document?apiId=636578074753912911
      x-documentation-category: 三维家AI / 空间AI
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                batchCount:
                  type: integer
                  format: int32
                  description: 出图张数
                initImagePath:
                  type: string
                  description: 初始图片路径
                prompt:
                  type: string
                  description: 出图语义
                styleImagePath:
                  type: string
                  description: 风格图路径，可根据风格图渲染出相似风格的结果图
                styleWeight:
                  type: number
                  format: float
                  description: 风格权重，0.40~T0.70之间，步长为0.05，当风格图参数不为空时，可调整风格权重，默认为0.6
            example:
              styleImagePath: ''
              batchCount: 0
              initImagePath: ''
              styleWeight: 0
              prompt: ''
      responses:
