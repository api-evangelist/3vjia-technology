                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      failTimes:
                        type: integer
                        format: int32
                        description: 任务自动轮询或重试过程中的失败次数。部分视频任务失败后会由调度逻辑累加，用于判断是否继续重试。
                      failure:
                        type: string
                        description: 任务自动轮询或重试过程中的失败次数。部分视频任务失败后会由调度逻辑累加，用于判断是否继续重试。
                      failureCode:
                        type: string
                        description: 任务失败码。任务失败时可用于程序化判断错误类型；不同渠道可能返回不同错误码。
                      finishTime:
                        type: string
                        format: date-time
                        description: 任务结束时间。任务成功、失败或取消后由调度/回调更新；任务仍在排队或生成中时通常为空。
                      images:
                        type: array
                        items: {}
                        description: 兼容旧图片任务响应的图片地址列表。batchGetTaskStatus 当前从统一异步任务表 aigc_hub_asyn_task 返回时通常为空，图片/视频最终结果以 result 字段为准。
                      info:
                        type: string
                        description: 兼容旧任务响应的提示信息。batchGetTaskStatus 当前从统一异步任务表 aigc_hub_asyn_task 返回时通常为空，失败信息请优先查看 failure/failureCode。
                      manualRetryTimes:
                        type: integer
                        format: int32
                        description: 人工触发重启任务的次数。调用 restart 接口或人工重试流程时可能累加。
                      progress:
                        type: number
                        format: float
                        description: 任务处理进度，范围通常为 0 到 1。部分渠道会在轮询时回写；成功时通常为 1；不支持进度的渠道可能为空。
                      reqJson:
                        type: string
                        description: 任务创建时保存的原始请求参数 JSON 字符串。doubaoVideo 保存 DoubaoVideoReq 转换后的请求 JSON；AI 图片任务保存对应生图请求 JSON。
                      result:
                        type: string
                        description: 任务最终结果。图片任务通常保存生成图片地址，多个结果可能以逗号分隔；视频任务通常保存生成视频地址或结果内容；任务未完成时通常为空。
                      startTime:
                        type: string
                        format: date-time
                        description: 任务开始时间。doubaoVideo 在创建模型方任务并保存统一异步任务时写入；AI 图片任务在进入执行或外部平台任务创建时写入。
                      status:
                        type: integer
                        format: int32
                        description: 统一异步任务状态。-1=未知或任务不存在，1=PENDING/排队中，2=RUNNING/生成中，3=SUCCEEDED/成功，4=FAILED/失败，5=CANCELLED/已取消。doubaoVideo 创建后通常为 2，AI 图片任务创建后通常为 1 或 2，任务完成后由调度或回调更新为 3/4。
                      taskId:
                        type: string
                        description: 统一异步任务 ID。doubaoVideo 场景保存为模型方返回的 Seedance 任务 ID；AI 图片异步任务为系统生成或模型方返回后关联的任务 ID。
                      taskType:
                        type: string
                        description: 任务类型，用于区分业务场景。取值来自统一异步任务表 task_type，例如 doubaoVideo 保存为 video_doubao，混合渲染保存为 mix_render，VOD 图片任务保存为 vod_image。
              example:
                msg: ''
                code: 0
                data:
                - finishTime: ''
                  images: []
                  failureCode: ''
                  failTimes: 0
                  result: ''
                  taskType: ''
                  failure: ''
                  progress: 0
                  startTime: ''
                  manualRetryTimes: 0
                  reqJson: ''
                  taskId: ''
                  info: ''
                  status: 0
                success: false
