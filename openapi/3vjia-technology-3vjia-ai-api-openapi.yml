                        description: 进度, 当状态为RUNNING时有值, 取值范围[0, 1]之间
                      seed:
                        type: integer
                        format: int64
                        description: seed, 此次生成视频所用的Seed
                      status:
                        type: string
                        description: 任务状态. -1:未知或者任务不存在, 1:排队中, 2:生成中, 3:生成成功, 4:生成失败, 5:已取消
                      taskId:
                        type: string
