                              type: string
                              description: 素材颜色
                            createTime:
                              type: string
                              description: 创建时间
                            customStyleIds:
                              type: array
                              items: {}
                              description: "This is List Type  \n所属规则/系列Ids"
                            groupName:
                              type: string
                              description: 素材组名称
                            groupType:
                              type: integer
                              format: int32
                              description: 素材组类型：1地板瓷砖、2墙体涂料、3模型、4墙体瓷砖、、6模型组合
                            height:
                              type: number
                              format: double
                              description: 高
                            id:
                              type: integer
                              format: int32
                              description: 主键id
                            imagePath:
                              type: string
                              description: 素材图片路径
                            is3d:
                              type: integer
                              format: int32
                              description: 3D启用1是0否默认0
                            isDirect:
                              type: integer
                              format: int32
                              description: 是否直接归属系列
                            isValid:
                              type: integer
                              format: int32
                              description: 禁用标识[0禁用1启用]默认1
                            kgId:
                              type: string
                              description: 图谱入库id
                            kgMaterialType:
                              type: string
                              description: 图谱模型分类名称
                            kgStatus:
                              type: integer
                              format: int32
                              description: 图谱入库状态：-1入库失败0未提交入库1入库中2入库成功
                            length:
                              type: number
                              format: double
                              description: 长
                            lengthMax:
                              type: integer
                              format: int32
                              description: 素材长度最大值
                            lengthMin:
                              type: integer
                              format: int32
                              description: 素材长度最小值
                            materialGroupId:
                              type: string
                              description: 素材组id
                            materialId:
                              type: string
                              description: 素材id
                            materialName:
                              type: string
                              description: 素材名称
                            materialSource:
                              type: string
                              description: 素材来源本机构/素材广场
                            materialStyle:
                              type: string
                              description: 素材风格
                            materialType:
                              type: integer
                              format: int32
                              description: 素材类型(1硬装、2软装、3定制)
                            modelFlag:
                              type: string
                              description: 模型类型标记
                            modelLoc:
                              type: string
                              description: 模型位(新版图谱中文名)
                            modellocId:
                              type: string
                              description: 模型位置id
                            modellocName:
                              type: string
                              description: 模型位置名称
                            msg:
                              type: string
                              description: msg
                            recommended:
                              type: boolean
                              description: 是否推荐素材
                            ruleId:
                              type: integer
                              format: int32
                              description: 设计规则id/系列ID
                            schemeType:
                              type: string
                              description: 方案种类cupboard:橱柜wardrobe:衣柜systemCabinet:系统柜
                            score:
                              type: number
                              format: float
                              description: 多模态分数
                            seedSchemeIds:
                              type: string
                              description: 种子方案ids
                            seriesKgId:
                              type: string
                              description: 系列kgId
                            spaceId:
                              type: string
                              description: 空间id
                            spaceName:
                              type: string
                              description: 空间名称
                            status:
                              type: string
                              description: 素材状态-1入库失败1入库中2入库成功
                            texture:
                              type: string
                              description: 素材材质
                            topViewImage:
                              type: string
                              description: 素材顶视图
                            traceId:
                              type: string
                              description: traceId
                            typeOnRelation:
                              type: string
                              description: 素材边上的type
                            width:
                              type: number
                              format: double
                              description: 宽
                            wireframeImage:
                              type: string
                              description: 线框图
                        description: This is List Type
              example:
                msg: ''
                code: 0
                data:
                  recordCount: 0
                  pageSize: 0
                  result:
