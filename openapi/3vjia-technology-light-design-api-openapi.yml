        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                applySpace:
                  type: string
                  description: 空间名称
                isPlatform:
                  type: integer
                  format: int32
                  description: 是否查询平台套系对应模型位数据1是0否默认0
                keyword:
                  type: string
                  description: 素材ID或素材名称搜索关键字
                lengthMax:
                  type: integer
                  format: int32
                  description: 素材长度最大值
                lengthMin:
                  type: integer
                  format: int32
                  description: 素材长度最小值
                materialId:
                  type: string
                  description: 素材id
                materialName:
                  type: string
                  description: 素材名称
                modelLoc:
                  type: string
                  description: 模型位(新版图谱中文名)
                orderBy:
                  type: string
                  description: 排序
                pageIndex:
                  type: integer
                  format: int32
                  description: 页码
                pageSize:
                  type: integer
                  format: int32
                  description: 页容量
                ruleId:
                  type: string
                  description: 规则ID
                seriesId:
                  type: string
                  description: 规则/系列ID
                status:
                  type: integer
                  format: int32
                  description: 素材状态-1入库失败1入库中2入库成功
            example:
              lengthMax: 0
              isPlatform: 0
              orderBy: ''
              pageSize: 0
              materialId: ''
              modelLoc: ''
              seriesId: ''
              applySpace: ''
              materialName: ''
              lengthMin: 0
              pageIndex: 0
              keyword: ''
              ruleId: ''
              status: 0
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      pageIndex:
                        type: integer
                        format: int32
                      pageSize:
                        type: integer
                        format: int32
                      recordCount:
                        type: integer
                        format: int32
                      result:
                        type: array
                        items:
                          type: object
                          properties:
                            applySpace:
                              type: array
                              items: {}
                              description: "This is List Type  \n应用空间"
                            brushStyleList:
                              type: array
                              items:
                                type: object
                                properties:
                                  styleCode:
                                    type: string
                                    description: 风格刷唯一标识(固定传值)code全屋风格刷:styleBrushId厨房风格刷:kitchenBrushId背景墙风格刷:wallBrushId
                                  styleId:
                                    type: string
                                    description: 风格刷ID
                                  styleImage:
                                    type: string
                                    description: 封面图
                                  styleName:
                                    type: string
                                    description: 风格名称
                                  styleType:
                                    type: string
                                    description: 风格类别
                                  xmlDataUrl:
                                    type: string
                                    description: 风格刷对应数据URL
                              description: '*风格刷参数'
                            category:
                              type: string
