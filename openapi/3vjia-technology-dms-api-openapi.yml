        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      diyOrderNo:
                        type: string
                        description: 自定义订单号
                      orderDesc:
                        type: string
                        description: 订单备注
                      orderName:
                        type: string
                        description: 订单名称
                      orderNo:
                        type: string
                        description: 生产订单号
                      orderRoom:
                        type: integer
                        format: int32
                        description: 所属空间 0未填写 1主卧 2客卧 3厨房 4客厅 5餐厅 6主卫 7次卫 8阳台
                      orderState:
                        type: integer
                        format: int32
                        description: 生产单状态 0-已创建 1-已分配 2-已拆单 3-生产中 9-已包装 4-已入库 5-已发货 6-已安装 7-已完成 8-已关闭
                      orderType:
                        type: integer
                        format: int32
                        description: 订单类型 0生产订单 1生产补单
                      patchReason:
                        type: integer
                        format: int32
                        description: 补单原因 0未填写 1设计错误 2审核错误 3生产错误 4运输损坏 5安装损坏 6客户新增
                      saleBillNo:
                        type: string
                        description: 销售单号
                      submitDate:
                        type: string
                        format: date-time
                        description: 创建时间
                      breakUserName:
                        type: string
                        description: 拆单人员
                      channelID:
                        type: string
                        description: 门店编码
                      createDate:
                        type: string
                        format: date-time
                        description: 创建时间
                      mainMaterial:
                        type: string
                        description: 材质颜色
                      urgent:
                        type: integer
                        format: int32
                        description: 订单标签
                      id:
                        type: integer
                        format: int64
                        description: 生产单唯一id
                    required:
                    - orderName
                    - orderNo
                    - orderRoom
                    - orderState
                    - orderType
                    - patchReason
                    - saleBillNo
                    - submitDate
                    - channelID
                    - id
