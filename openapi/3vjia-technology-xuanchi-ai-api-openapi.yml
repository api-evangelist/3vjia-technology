      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: integer
                  format: int64
                  description: 渲染模板配置ID。见文档：https://help.3vjia.com/doc/open_doc/456823276459593731/723925629921284207
                  examples:
                  - '649971879238631495'
                extraParams:
                  type: object
                  description: '扩展信息。分辨率：aspectRatio。示例：{"aspectRatio": "1536x1024"}'
                sourceImageUrl:
                  type: string
                  description: 原图片
                replaceTarget:
                  type: string
                  description: 区域
                  examples:
                  - 地板
                  default: 地板
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      imageUrl:
                        type: string
                        description: 产品图片
                    required:
                    - imageUrl
                  description: 产品信息列表
                prompt:
                  type: string
                  description: 提示语
                modelVersion:
                  type: string
                  default: i_o_2
              required:
              - extraParams
              - sourceImageUrl
              - products
            example:
              modelVersion: ''
              extraParams: ''
              templateId: 649971879238631495
              products:
              - imageUrl: ''
              replaceTarget: 地板
              sourceImageUrl: ''
              prompt: ''
