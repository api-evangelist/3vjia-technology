      description: AI 空间设计
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items: {}
                  description: 空间设计图片列表,原始图放第一张，产品图放后面
              required:
              - images
            example:
              images: []
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      info:
                        type: string
                        description: 生成信息
                      taskId:
                        type: string
                        description: 任务ID
              example:
                msg: ''
                code: 0
                data:
                  taskId: ''
                  info: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
