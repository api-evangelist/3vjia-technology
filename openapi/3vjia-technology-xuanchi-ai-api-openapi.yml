                      taskId:
                        type: string
                        description: 任务ID
                        examples:
                        - 0bc2b9b6-3b4e-4c5b-a490-4aaaf4e81416
              example:
                msg: 成功
                code: 0
                data:
                  taskId: 0bc2b9b6-3b4e-4c5b-a490-4aaaf4e81416
                  info: 任务已发送至队列中
