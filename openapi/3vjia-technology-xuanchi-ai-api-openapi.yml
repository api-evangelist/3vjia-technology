      x-documentation-category: 玄尺AI / AI设计
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: 提示词
                  examples:
                  - 现代风格
                initImage:
                  type: string
                  description: 原图
                  examples:
                  - https://xxx.com/xxx.jpg
                maskImage:
                  type: string
                  description: 遮罩图
                  examples:
                  - https://xxx.com/xxx.jpg
                batchCount:
                  type: integer
                  format: int32
                  description: 出图张数，默认1
                  examples:
                  - '1'
              required:
              - initImage
              - maskImage
            example:
              initImage: https://xxx.com/xxx.jpg
              batchCount: 1
              prompt: 现代风格
              maskImage: https://xxx.com/xxx.jpg
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      info:
                        type: string
                        description: 生成信息
                        examples:
                        - 任务已发送至队列中
                      taskId:
                        type: string
                        description: 任务ID
                        examples:
                        - 0bc2b9b6-3b4e-4c5b-a490-4aaaf4e81416
              example:
                msg: 成功
                code: 0
                data:
                  taskId: 0bc2b9b6-3b4e-4c5b-a490-4aaaf4e81416
                  info: 任务已发送至队列中
                success: true
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/render/bricksChange:
