  /api/v1/line/oss/getUploadToken:
    post:
      operationId: apiV1LineOssGetUploadToken
      summary: 获取线条上传签名接口
      tags:
      - Products
      x-source-documentation: https://dev.3vjia.com/document?apiId=644937818719805452
      x-documentation-category: 产品模块 / 线条上传
      description: 注意：上传CAD文件不超过1M，支持格式 dwg、dxf
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: object
                  description: 文件名变量
                  examples:
                  - '{"fileName":"d2xidz2jifsotegzzrvnahhaxck5y6aw"}'
                fileSuffix:
                  type: string
                  description: 上传的文件后缀，不带'.'，支持格式 dwg、dxf
            example:
              fileSuffix: ''
              context: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      accessKeyId:
                        type: string
                        description: 访问密钥标识
                      contentType:
                        type: string
                        description: 华为云和腾讯云都要把 Content-Type 作为表单字段返回（非空的时候带过去，或者指定 prefix 的时候要自己生成并带过去）
                      contentTypePrefix:
                        type: string
                        description: 内容类型前缀
                      expireAt:
                        type: integer
                        format: int64
                        description: 签名过期10位秒级时间戳
                      expireTime:
                        type: string
                        format: date-time
                        description: 签名过期时间
                      formFields:
                        type: object
                        description: 表单字段，用于前端直传时的表单字段填充（这里只考虑用户元数据相关的认证信息）
                      key:
                        type: string
                        description: 约束上传的key
                      ossHost:
                        type: string
                        description: 需要上传到哪个OSS上，值为OSS地址或者CDN域名
                      policy:
                        type: string
                        description: 签名上传的约束策略，比如大小、前缀等
                      readDomain:
                        type: string
                        description: 对于公共读bucket，该值用于拼接完整域名
                      securityToken:
                        type: string
                        description: 安全令牌（当基于STS或者IAM生成签名时前端的表单必须同时携带该参数）
                      signature:
                        type: string
                        description: 签名
                      vendor:
                        type: string
                        description: 本次生成签名对应的厂商
                    required:
                    - expireTime
                    - vendor
              example:
                msg: ''
                code: 0
                data:
                  accessKeyId: ''
                  signature: ''
                  contentTypePrefix: ''
                  expireAt: 0
                  ossHost: ''
                  securityToken: ''
                  expireTime: ''
                  readDomain: ''
                  vendor: ''
                  formFields: ''
                  contentType: ''
                  key: ''
                  policy: ''
                success: false
