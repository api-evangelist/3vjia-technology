  /api/v1/roomMaterial/editModel:
    post:
      operationId: apiV1RoomMaterialEditModel
      summary: 编辑全屋定制模型数据接口
      tags:
      - Products
      x-source-documentation: https://dev.3vjia.com/document?apiId=605731045719040097
      x-documentation-category: 产品模块 / 素材管理
      description: '本接口采用字段覆盖保存模式，而非部分更新。表中标注"如果不传或传 null，将用 null 覆盖"或"用 0 覆盖"的字段，会被清空为 null 或重置为 0。调用时若不希望某字段被清空或重置，请将该字段的原值一并传回。 最简单的方式就是， `先调/api/v1/productMaterial/getModel接口（文档地址：https://help.3vjia.com/doc/open_doc/456823276459593731/841686263705800714）把数据拿回来，直接把 designMaterial和product对象（字段）copy过去，然后再针对自己需要改的字段进行修改`

        **素材主表**

        | 字段 | 中文含义 | 落库位置 | 传空结果 |

        |---|---|---|---|

        | `designMaterial.categoryId` | 素材分类ID | 素材主表 | 会更新为 `0` |

        | `designMaterial.brickId` | 异型砖ID | 素材主表 | 会更新为 `null` |

        | `designMaterial.lightProperty` | 灯光属性 | 素材主表 | 会更新为 `null` |

        | `designMaterial.orientation` | 开门方向 | 素材主表 | 会更新为 `null` |

        | `designMaterial.materialAttribute` | 属性类别 | 素材主表 | 会更新为 `null` |

        | `designMaterial.placeRule` | 放置规则 | 素材主表 | 会更新为 `null` |

        | `designMaterial.picHeight` | 高 | 素材主表 | 会更新为 `null` |

        | `designMaterial.picLength` | 长 | 素材主表 | 会更新为 `null` |

        | `designMaterial.picWidth` | 宽 | 素材主表 | 会更新为 `null` |

        | `designMaterial.placeHeight` | 放置高度 | 素材主表 | 会更新为 `null` |

        | `designMaterial.retailPrice` | 零售价 | 素材主表 | 会更新为 `null` |

        | `designMaterial.holeLength` | 开孔尺寸-长 | 素材主表 | 会更新为 `null` |

        | `designMaterial.holeWidth` | 开孔尺寸-宽 | 素材主表 | 会更新为 `null` |

        | `designMaterial.designCode` | 素材编号 | 素材主表 | 会更新为 `null` |

        | `designMaterial.modelDepth` | 模型深度 | 素材主表 | 会更新为 `null` |

        | `designMaterial.parts` | 部件属性 | 素材主表 | 会更新为 `null` |

        | `designMaterial.materialType` | 素材类别 | 素材主表 | 会更新为 `null` |


        **商品相关**

        | 字段 | 中文含义 | 落库位置 | 传空结果 |

        |---|---|---|---|

        | `product.brandId` | 品牌ID | 品牌/系列绑定关系 | 会更新为 `0` |

        | `product.seriesId` | 系列ID | 品牌/系列绑定关系 | 会更新为 `0` |

        | `product.model` | 型号 | 商品表 | 会更新为空值 |

        | `product.unit` | 计价单位/报价单位 | 商品表 | 会更新为空值 |'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                designMaterial:
                  type: object
                  properties:
                    categoryId:
                      type: integer
                      format: int32
                      description: 素材分类ID，如果不传或传 null，将用 0 覆盖该字段，原值会被清掉
                    designCode:
                      type: string
                      description: 素材编码(部件编号)，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    holeLength:
                      type: integer
                      format: int32
                      description: 开孔尺寸-长，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    holeWidth:
                      type: integer
                      format: int32
                      description: 开孔尺寸-宽，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    is3d:
                      type: integer
                      format: int32
                      description: 启用3D状态
                    lightProperty:
                      type: string
                      description: 灯光属性，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    materialAttribute:
                      type: string
                      description: 属性类别，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    materialId:
                      type: string
                      description: 素材ID
                    materialName:
                      type: string
                      description: 素材名称
                    materialType:
                      type: string
                      description: 素材类别，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    orientation:
                      type: integer
                      format: int32
                      description: 开门方向：1=左开、2=右开，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    parts:
                      type: string
                      description: 部件属性，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    picHeight:
                      type: number
                      format: double
                      description: 模型-高，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    picLength:
                      type: number
                      format: double
                      description: 模型-长，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    picWidth:
                      type: number
                      format: double
                      description: 模型-宽，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    placeHeight:
                      type: string
                      description: 放置高度，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    placeRule:
                      type: string
                      description: 放置规则，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    productId:
                      type: string
                      description: 产品ID
                    property:
                      type: string
                      description: 材质属性
                    remark:
                      type: string
                      description: 备注
                    subParts:
                      type: string
                      description: 子部件属性
                  required:
                  - categoryId
                  - materialId
                  - materialType
                  description: 素材信息
                moduleName:
                  type: string
                  description: 模块名称，即当前操作的模块，比如：全屋定制衣柜模型、全屋定制衣柜贴图
                  examples:
                  - 全屋定制衣柜贴图
                needUpdateXmlContent:
                  type: boolean
                  description: 是否要更新XML内容
                  examples:
                  - 'false'
                product:
                  type: object
                  properties:
                    brandId:
                      type: integer
                      format: int32
                    model:
                      type: string
                      description: 型号，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                    seriesId:
                      type: integer
                      format: int32
                    unit:
                      type: string
                      description: 计价单位，如果不传或传 null，将用 null 覆盖该字段，原值会被清掉
                  description: 产品信息
                xmlContent:
                  type: string
                  description: XML内容
              required:
              - designMaterial
            example:
              product:
                seriesId: 0
                unit: ''
                brandId: 0
                model: ''
              moduleName: 全屋定制衣柜贴图
              needUpdateXmlContent: false
              designMaterial:
                picWidth: 0
                orientation: 0
                holeWidth: 0
                lightProperty: ''
                picHeight: 0
                productId: ''
                materialType: ''
                is3d: 0
                remark: ''
                materialId: ''
                materialAttribute: ''
                holeLength: 0
                subParts: ''
                materialName: ''
                placeHeight: ''
                placeRule: ''
                parts: ''
                picLength: 0
                property: ''
                designCode: ''
                categoryId: 0
              xmlContent: ''
      responses:
        '200':
          description: 成功 / OK
          content:
