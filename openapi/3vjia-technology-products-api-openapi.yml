        | 4 = 替换材质 |23 = 浴室柜 | 36 = 涂料 |

        | 15 = 模型组合 |24 = 淋浴房 | |

        | 37 = 自由建模 |13 = 卫浴 | |

        | |17 = 整木 | |

        | |28 = 铝门窗 | |

        | |22 = 定制通用 | |'
