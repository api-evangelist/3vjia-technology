  /api/v1/model/oss/getUploadToken:
    post:
      operationId: apiV1ModelOssGetUploadToken
      summary: 获取模型上传签名接口
      tags:
      - Products
      x-source-documentation: https://dev.3vjia.com/document?apiId=595553824777854980
      x-documentation-category: 产品模块 / 模型上传
      description: 注意：支持上传的压缩包容量不大于600M
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileSuffix:
                  type: string
                  description: 上传文件后缀，注意不带'.'，支持：zip、rar
                  examples:
                  - zip
              required:
              - fileSuffix
            example:
              fileSuffix: zip
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      accessKeyId:
                        type: string
                        description: 访问密钥标识
                        examples:
                        - STS.NUXbrKhhZ3VhU54iEfDYXFwBh
                      contentType:
                        type: string
                        description: 华为云和腾讯云都要把 Content-Type 作为表单字段返回（非空的时候带过去，或者指定 prefix 的时候要自己生成并带过去）
                      contentTypePrefix:
                        type: string
                        description: 内容类型前缀
                      expireAt:
                        type: integer
                        format: int64
                        description: 签名过期10位秒级时间戳
                        examples:
                        - '1719801893'
                      expireTime:
                        type: string
                        format: date-time
                        description: 签名过期时间
                        examples:
                        - '2024-07-01 10:44:53'
                      formFields:
                        type: object
                        description: 表单字段，用于前端直传时的表单字段填充
                      key:
                        type: string
                        description: 约束上传的key
                        examples:
                        - modelfile/20240701/a17865bfcc7c45ca9da009de871a0081.rar
                      ossHost:
                        type: string
                        description: 需要上传到哪个OSS上，值为OSS地址或者CDN域名
                        examples:
                        - https://3vj-maxzip-w.3vjia.com
                      policy:
                        type: string
                        description: 签名上传的约束策略，比如大小、前缀等
                        examples:
                        - eyJleHBpcm*********ZTg3MWEwMDgxLnJhciJdXX0=
                      readDomain:
                        type: string
                        description: 不支持公共读
                      securityToken:
                        type: string
                        description: 安全令牌（当基于STS或者IAM生成签名时前端的表单必须同时携带该参数）
                        examples:
                        - CAIS8wJ1q6Ft5*********PxEa2QRA+BRZWCd3FcjinYfLzW4toIAA=
                      signature:
                        type: string
                        description: 签名
                        examples:
                        - EFntYAYO74/+9Z1MGqeJ7/bD0mQ=
                      vendor:
                        type: string
                        description: 本次生成签名对应的厂商
                        examples:
                        - ali
                    required:
                    - expireTime
                    - vendor
              example:
                msg: ''
                code: 0
                data:
                  accessKeyId: STS.NUXbrKhhZ3VhU54iEfDYXFwBh
                  signature: EFntYAYO74/+9Z1MGqeJ7/bD0mQ=
                  contentTypePrefix: ''
                  expireAt: 1719801893
                  ossHost: https://3vj-maxzip-w.3vjia.com
                  securityToken: CAIS8wJ1q6Ft5*********PxEa2QRA+BRZWCd3FcjinYfLzW4toIAA=
                  expireTime: '2024-07-01 10:44:53'
                  readDomain: ''
                  vendor: ali
                  formFields: ''
                  contentType: ''
                  key: modelfile/20240701/a17865bfcc7c45ca9da009de871a0081.rar
                  policy: eyJleHBpcm*********ZTg3MWEwMDgxLnJhciJdXX0=
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
