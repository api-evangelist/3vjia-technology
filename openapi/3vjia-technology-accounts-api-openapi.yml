openapi: 3.2.0
info:
  title: 3vjia Open Platform Accounts API
  version: '2026-09-05'
  summary: Home-furnishing 3D cloud design, quotation, order, manufacturing (AIMES/MOS/DMS) and AI operations exposed by the 3vjia (三维家) Open Platform.
  description: Machine-readable description of the 3vjia (三维家 / AiHouse) Open Platform, DERIVED — not published by the provider in this form.
  contact:
    name: 3vjia Open Platform
    url: https://dev.3vjia.com/
servers:
- url: https://open-gateway.3vjia.com
  description: 3vjia Open Platform gateway (current)
- url: https://open.3vjia.com
  description: Legacy open gateway — takes ?sysCode=external&access_token=
security:
- oauth2ClientCredentials: []
tags:
- name: Accounts
  description: 账号模块
paths:
  /api/shop/deleteDeptAndShopRelation:
    post:
      operationId: apiShopDeleteDeptAndShopRelation
      summary: 批量解除门店绑定部门接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=475005267981971499
      x-documentation-category: 账号模块 / 门店管理
      description: 批量解除门店绑定部门
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deptId:
                  type: string
                  description: 三维家部门ID，deptId和outDeptId两个至少传一个，用于查找部门，传入deptId后将忽略outDeptId
                  examples:
                  - '20171234'
                outDeptId:
                  type: string
                  description: 部门对应的企业系统部门ID，deptId和outDeptId两个至少传一个，用于查找部门，不传deptId时outDeptId有效
                  examples:
                  - '456789'
                outShopIdList:
                  type: array
                  items: {}
                  description: 门店对应的企业系统门店ID列表，shopIdList和outShopIdList两个至少传一个，用于查找门店，不传shopIdList时outShopIdList有效
                  examples:
                  - '["20171234","20171235"]'
                shopIdList:
                  type: array
                  items: {}
                  description: 三维家门店ID列表，shopIdList和outShopIdList两个至少传一个，用于查找门店，传入shopIdList后将忽略outShopIdList
                  examples:
                  - '["456789","456780"]'
            example:
              deptId: '20171234'
              outShopIdList: []
              shopIdList: []
              outDeptId: '456789'
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
              example:
                msg: ''
                code: 0
                data: true
                success: true
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/accountbinding/bindAccount:
    post:
      operationId: apiV1AccountbindingBindAccount
      summary: 账号绑定接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=454653867632689213
      x-documentation-category: 账号模块 / 单点登录
      description: 企业系统账号绑定三维家账号，回收站内的三维家账号无法绑定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outUserId:
                  type: string
                  description: 企业系统的用户ID，用于绑定或解绑三维家账号
                  examples:
                  - '123456'
                userName:
                  type: string
                  description: 要绑定或解绑的三维家账号
                  examples:
                  - 3vj13800000000
              required:
              - outUserId
              - userName
            example:
              outUserId: '123456'
              userName: 3vj13800000000
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      outUserId:
                        type: string
                        description: 企业系统的用户ID，与入参一致
                        examples:
                        - '123456'
                      userId:
                        type: string
                        description: 绑定的三维家用户ID
                        examples:
                        - '1000123456'
                      userName:
                        type: string
                        description: 绑定的三维家账号，与入参一致
                        examples:
                        - 3vj13800000000
              example:
                msg: ''
                code: 0
                data:
                  outUserId: '123456'
                  userName: 3vj13800000000
                  userId: '1000123456'
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/accountbinding/getAccountBindingRelation:
    post:
      operationId: apiV1AccountbindingGetAccountBindingRelation
      summary: 获取账号绑定关系接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=454749021953654841
      x-documentation-category: 账号模块 / 单点登录
      description: 获取企业账号和三维家账号账号之间的绑定关系，当不需要过滤条件时，入参请传一个空字典，而非不传
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                outUserId:
                  type: string
                  description: 企业系统中绑定过三维家账号的用户ID
                userName:
                  type: string
                  description: 三维家用户账号
            example:
              outUserId: ''
              userName: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      createTime:
                        type: string
                        description: 绑定时间，格式yyyy-MM-ddHH:mm:ss
                      outUserId:
                        type: string
                        description: 企业系统的用户ID
                      userId:
                        type: string
                        description: 三维家用户ID
                      userName:
                        type: string
                        description: 三维家账号
              example:
                msg: ''
                code: 0
                data:
                - outUserId: ''
                  userName: ''
                  userId: ''
                  createTime: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/accountbinding/getCurrentAppBindingRelationPage:
    post:
      operationId: apiV1AccountbindingGetCurrentAppBindingRelationPage
      summary: 分页获取账号绑定关系列表接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=617418915324252243
      x-documentation-category: 账号模块 / 单点登录
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pageIndex:
                  type: integer
                  format: int32
                  description: 页码
                  examples:
                  - '1'
                  default: '1'
                pageSize:
                  type: integer
                  format: int32
                  description: 每页条数，最大支持500条
                  examples:
                  - '10'
                  default: '50'
            example:
              pageSize: 10
              pageIndex: 1
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      pageIndex:
                        type: integer
                        format: int32
                        description: 页码
                      pageSize:
                        type: integer
                        format: int32
                        description: 每页条数
                      recordCount:
                        type: integer
                        format: int32
                        description: 记录总数
                      result:
                        type: array
                        items:
                          type: object
                          properties:
                            appId:
                              type: string
                            createTime:
                              type: string
                              description: 绑定时间，格式yyyy-MM-ddHH:mm:ss
                            outUserId:
                              type: string
                              description: 企业系统的用户ID
                            userId:
                              type: string
                              description: 三维家用户ID
                            userName:
                              type: string
                              description: 三维家账号
                        description: 结果列表
              example:
                msg: ''
                code: 0
                data:
                  recordCount: 0
                  pageSize: 0
                  result:
                  - outUserId: ''
                    userName: ''
                    userId: ''
                    createTime: ''
                    appId: ''
                  pageIndex: 0
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/accountbinding/unBindAccount:
    post:
      operationId: apiV1AccountbindingUnBindAccount
      summary: 账号解绑接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=454656043478220888
      x-documentation-category: 账号模块 / 单点登录
      description: 企业系统账号解绑三维家账号
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                outUserId:
                  type: string
                  description: 企业系统的用户ID，用于绑定或解绑三维家账号
                  examples:
                  - '123456'
                userName:
                  type: string
                  description: 要绑定或解绑的三维家账号
                  examples:
                  - FC68EF65199AD915B91433373FD64BF0
            example:
              outUserId: '123456'
              userName: FC68EF65199AD915B91433373FD64BF0
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
              example:
                msg: ''
                code: 0
                data: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/department/createDept:
    post:
      operationId: apiV1DepartmentCreateDept
      summary: 添加部门接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=474673567347347494
      x-documentation-category: 账号模块 / 部门管理
      description: 添加部门
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                customerCode:
                  type: string
                  description: 部门对应客户部门编码
                deptName:
                  type: string
                  description: 部门名称
                deptType:
                  type: integer
                  format: int32
                  description: 经销商类型默认值0=普通部门、1=经销商
                outDeptId:
                  type: string
                  description: 部门对应的企业系统部门ID，用于做绑定
                outParentId:
                  type: string
                  description: 上级部门对应企业系统的部门ID，parentId为空时此值有效
                parentId:
                  type: string
                  description: 上级部门的ID，三维家的部门ID，传入此值时，将忽略outParentId
                shortName:
                  type: string
                  description: 部门简称
            example:
              deptName: ''
              customerCode: ''
              deptType: 0
              parentId: ''
              outParentId: ''
              outDeptId: ''
              shortName: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      customerCode:
                        type: string
                        description: 部门对应客户部门编码
                      deptId:
                        type: string
                        description: 创建成功后产生的部门ID
                      deptName:
                        type: string
                        description: 部门名称，与入参一致
                      outDeptId:
                        type: string
                        description: 企业系统的部门ID，与入参的outDeptId一致
              example:
                msg: ''
                code: 0
                data:
                  deptName: ''
                  deptId: ''
                  customerCode: ''
                  outDeptId: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/department/deleteDept:
    post:
      operationId: apiV1DepartmentDeleteDept
      summary: 删除部门接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=474673473520762923
      x-documentation-category: 账号模块 / 部门管理
      description: 删除部门，部门下存在账号、子部门时不允许删除
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deptId:
                  type: string
                  description: 三维家部门ID，deptId和outDeptId两个至少传一个，用于查找要删除的部门，传入deptId后将忽略outDeptId
                  examples:
                  - '20171234'
                outDeptId:
                  type: string
                  description: 部门对应的企业系统部门ID，deptId和outDeptId两个至少传一个，用于查找要删除的部门，不传deptId时outDeptId有效
                  examples:
                  - '456789'
            example:
              deptId: '20171234'
              outDeptId: '456789'
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
              example:
                msg: 成功
                code: 0
                data: true
                success: true
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/department/getDept:
    post:
      operationId: apiV1DepartmentGetDept
      summary: 获取部门信息接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=474673473520762917
      x-documentation-category: 账号模块 / 部门管理
      description: 获取单个部门信息
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deptId:
                  type: string
                  description: 三维家部门ID，deptId和outDeptId两个至少传一个，用于查找要删除的部门，传入deptId后将忽略outDeptId
                  examples:
                  - '20171234'
                outDeptId:
                  type: string
                  description: 部门对应的企业系统部门ID，deptId和outDeptId两个至少传一个，用于查找要删除的部门，不传deptId时outDeptId有效
                  examples:
                  - '456789'
            example:
              deptId: '20171234'
              outDeptId: '456789'
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      createDate:
                        type: string
                        description: 创建时间，格式yyyy-MM-ddHH:mm:ss
                      customerCode:
                        type: string
                        description: 部门对应客户部门编码
                      deptId:
                        type: string
                        description: 部门ID
                      deptName:
                        type: string
                        description: 部门名称
                      organ:
                        type: object
                        properties:
                          organId:
                            type: string
                            description: 企业ID
                          organName:
                            type: string
                            description: 企业名称
                        description: 部门所属机构信息
                      outDeptId:
                        type: string
                        description: 部门绑定的企业系统部门ID，要绑定过才有值
                      parentDept:
                        type: object
                        properties:
                          customerCode:
                            type: string
                            description: 部门对应客户部门编码
                          deptId:
                            type: string
                            description: 部门ID
                          deptName:
                            type: string
                            description: 部门名称
                          outDeptId:
                            type: string
                            description: 部门所绑定企业系统部门ID，绑定过才有值
                          storeType:
                            type: integer
                            format: int32
                            description: 类型0=门店，1=部门
                        description: 上级部门信息
                      shortName:
                        type: string
                        description: 部门简称
              example:
                msg: ''
                code: 0
                data:
                  organ:
                    organName: ''
                    organId: ''
                  deptName: ''
                  deptId: ''
                  customerCode: ''
                  parentDept:
                    deptName: ''
                    storeType: 0
                    deptId: ''
                    customerCode: ''
                    outDeptId: ''
                  outDeptId: ''
                  shortName: ''
                  createDate: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/department/getDeptListByPage:
    post:
      operationId: apiV1DepartmentGetDeptListByPage
      summary: 获取部门列表接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=474673567347347496
      x-documentation-category: 账号模块 / 部门管理
      description: 分页获取部门列表，当不需要过滤时，入参请传空字典，而非不传
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deptName:
                  type: string
                  description: 部门名称，精确搜索
                  examples:
                  - 测试部门
                likeDeptName:
                  type: string
                  description: 部门名称，模糊搜索
                  examples:
                  - 测试
                outParentId:
                  type: string
                  description: 上级部门对应企业系统的部门ID，parentId为空时此值有效，要用上级部门过滤时传入
                  examples:
                  - '123456'
                pageIndex:
                  type: integer
                  format: int32
                  description: 页码，最小值为1，默认值为1
                  examples:
                  - '1'
                pageSize:
                  type: integer
                  format: int32
                  description: 分页大小，最小值1，最大值500，默认值50
                  examples:
                  - '50'
                parentId:
                  type: string
                  description: 上级部门的ID，三维家的部门ID，传入此值时，将忽略outParentId，要用上级部门过滤时传入
                  examples:
                  - '20171234'
            example:
              deptName: 测试部门
              pageSize: 50
              parentId: '20171234'
              outParentId: '123456'
              pageIndex: 1
              likeDeptName: 测试
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      pageIndex:
                        type: integer
                        format: int64
                        description: 当前查询第几页
                      pageSize:
                        type: integer
                        format: int64
                        description: 当前查询页记录数
                      recordCount:
                        type: integer
                        format: int64
                        description: 总数
                      result:
                        type: array
                        items:
                          type: object
                          properties:
                            createDate:
                              type: string
                              description: 创建时间，格式yyyy-MM-ddHH:mm:ss
                            customerCode:
                              type: string
                              description: 部门对应客户部门编码
                            deptId:
                              type: string
                              description: 部门ID
                            deptName:
                              type: string
                              description: 部门名称
                            outDeptId:
                              type: string
                              description: 部门绑定的企业系统部门ID，要绑定过才有值
                            parentId:
                              type: string
                              description: 父级部门Id
                            shortName:
                              type: string
                              description: 部门简称
                        description: 部门信息结构,列表用,V2
                      totalPage:
                        type: integer
                        format: int64
                        description: 总页数
              example:
                msg: 成功
                code: 0
                data:
                  totalPage: 0
                  recordCount: 0
                  pageSize: 0
                  result:
                  - deptName: ''
                    deptId: ''
                    customerCode: ''
                    parentId: ''
                    outDeptId: ''
                    shortName: ''
                    createDate: ''
                  pageIndex: 0
                success: true
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/department/getDeptTreeList:
    post:
      operationId: apiV1DepartmentGetDeptTreeList
      summary: 获取部门树形列表接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=474670883894562902
      x-documentation-category: 账号模块 / 部门管理
      description: 获取部门树形列表，不需要参数
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deptId:
                  type: string
                  description: 三维家部门ID
                  examples:
                  - '20171234'
            example:
