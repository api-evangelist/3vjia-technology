  /api/v1/user/create:
    post:
      operationId: apiV1UserCreate
      summary: 添加账号接口
      tags:
      - Accounts
      x-source-documentation: https://dev.3vjia.com/document?apiId=454656043478220890
      x-documentation-category: 账号模块 / 账号管理
      description: 添加三维家账号，并绑定企业用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deptId:
                  type: string
                  description: 账号所属三维家部门ID，关联部门传该字段
                  examples:
                  - '123456'
                extendRoleList:
                  type: array
                  items: {}
                  description: 账号所拥有的额外角色列表，角色需在三维家CRM后台管理中创建
                  examples:
                  - '["123456","456789"]'
                mobile:
                  type: string
                  description: 用户手机号码，若传此值，需要保证此值符合手机号码格式，且此手机号没有被任何一个企业注册过三维家
                  examples:
                  - '13800000000'
                name:
                  type: string
                  description: 用户姓名
                  examples:
                  - 测试人员
                nickName:
                  type: string
                  description: 用户昵称
                  examples:
                  - 测试人员
                note:
                  type: string
                  description: 备注，不超过256个字符
                  examples:
                  - 备注
                outUserId:
                  type: string
                  description: 账号在企业系统里的用户ID，此值将和三维家用户ID做绑定关系，用于单点登录等场景
                  examples:
                  - A123456
                password:
                  type: string
                  description: 账号密码，密码必须由6-20位字母、数字和符号的组合，至少需要包含两种
                  examples:
                  - abc123456
                selfIntro:
                  type: string
                  description: 自我介绍，不能超过2000个字符
                  examples:
                  - 自我介绍
                sex:
                  type: string
                  description: 性别，0=男，1=女，默认0
                  examples:
                  - '0'
                shopId:
                  type: string
                  description: 账号所属三维家门店ID，关联门店传该字段
                  examples:
                  - '123456'
                userName:
                  type: string
                  description: 要新增的三维家用户账号，需要由4-20个数字、字母组成（数字+字母，两者都需要有），账号名需要全网唯一，若传入的账号被其他企业注册过，会注册失败，建议使用机构的字母简称+手机号码
                  examples:
                  - 3vj123456
              required:
              - name
              - outUserId
              - password
              - userName
            example:
              note: 备注
              nickName: 测试人员
              sex: '0'
              deptId: '123456'
              mobile: '13800000000'
              outUserId: A123456
              userName: 3vj123456
              extendRoleList: []
              password: abc123456
              name: 测试人员
              shopId: '123456'
              selfIntro: 自我介绍
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      outUserId:
                        type: string
                        description: 企业用户ID，和三维家用户ID绑定
                        examples:
                        - A123456
                      userId:
                        type: string
                        description: 创建成功后的三维家用户ID
                        examples:
                        - 3vj123456
                      userName:
                        type: string
                        description: 创建成功后的三维家账号
                        examples:
                        - 3vj123456
              example:
                msg: ''
                code: 0
                data:
                  outUserId: A123456
                  userName: 3vj123456
                  userId: 3vj123456
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
