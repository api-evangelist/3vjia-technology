openapi: 3.2.0
info:
  title: 3vjia Open Platform Design Schemes API
  version: '2026-09-05'
  summary: Home-furnishing 3D cloud design, quotation, order, manufacturing (AIMES/MOS/DMS) and AI operations exposed by the 3vjia (三维家) Open Platform.
  description: Machine-readable description of the 3vjia (三维家 / AiHouse) Open Platform, DERIVED — not published by the provider in this form.
  contact:
    name: 3vjia Open Platform
    url: https://dev.3vjia.com/
servers:
- url: https://open-gateway.3vjia.com
  description: 3vjia Open Platform gateway (current)
- url: https://open.3vjia.com
  description: Legacy open gateway — takes ?sysCode=external&access_token=
security:
- oauth2ClientCredentials: []
tags:
- name: Design Schemes
  description: 方案模块
paths:
  /api/schemecategory/updateSchemeCategory:
    post:
      operationId: apiSchemecategoryUpdateSchemeCategory
      summary: 编辑方案分类接口
      tags:
      - Design Schemes
      x-source-documentation: https://dev.3vjia.com/document?apiId=475026463813349465
      x-documentation-category: 方案模块 / 方案分类
      description: 编辑方案分类
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryCode:
                  type: string
                  description: 分类代码，可自定义的代码，不超过32个字符
                categoryId:
                  type: string
                  description: 要修改的分类的ID
                categoryName:
                  type: string
                  description: 分类名称，不能超过512个字符
                hasChildren:
                  type: integer
                  format: int32
                  description: 是否有子分类，1=有，0=无，默认0
                parentId:
                  type: string
                  description: 分类所属的上级ID
                sortCode:
                  type: integer
                  format: int32
                  description: 分类排序码，会影响显示顺序，默认为0
            example:
              hasChildren: 0
              categoryCode: ''
              categoryName: ''
              sortCode: 0
              parentId: ''
              categoryId: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
              example:
                msg: ''
                code: 0
                data: true
                success: true
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/taggroup/page:
    post:
      operationId: apiTaggroupPage
      summary: 分页查询标签组和标签信息
      tags:
      - Design Schemes
      x-source-documentation: https://dev.3vjia.com/document?apiId=744248039480377472
      x-documentation-category: 方案模块 / 方案岛
      description: 分页查询标签组信息
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pageIndex:
                  type: integer
                  format: int32
                pageSize:
                  type: integer
                  format: int32
                sorts:
                  type: array
                  items:
                    type: object
                    properties:
                      sortField:
                        type: string
                        description: 排序字段
                      sortType:
                        type: string
                        description: 排序类型，asc或者desc
                  description: "This is List Type  \n查询排序集合"
                where:
                  type: object
                  properties:
                    groupStatus:
                      type: string
                      description: 分组状态：enable-启用，disable-禁用
                    groupType:
                      type: integer
                      format: int32
                      description: 标签组类型：0-全屋空间案例库，1-营销活动套餐库，2-卫浴空间案例库，3-阳台空间案例库，4-全场景高端定制方案，5-卫浴个性空间案例库，6-淋浴房空间案例库
                    isShowDisabledTags:
                      type: integer
                      format: int32
                      description: 是否显示禁用标签项，0-不显示，1-显示
                  description: 分页查询标签分组
            example:
              pageSize: 0
              pageIndex: 0
              where:
                groupType: 0
                groupStatus: ''
                isShowDisabledTags: 0
              sorts:
              - sortType: ''
                sortField: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      pageIndex:
                        type: integer
                        format: int32
                      pageSize:
                        type: integer
                        format: int32
                      recordCount:
                        type: integer
                        format: int32
                      result:
                        type: array
                        items:
                          type: object
                          properties:
                            createDate:
                              type: string
                              description: 创建时间
                            creator:
                              type: string
                              description: 创建人
                            groupName:
                              type: string
                              description: 分组名称
                            groupStatus:
                              type: string
                              description: 是否启用：enable-启用，disable-禁用
                            groupType:
                              type: integer
                              format: int32
                              description: 标签组类型：0-全屋空间案例库，1-营销活动套餐库，2-卫浴空间案例库，3-阳台空间案例库，4-全场景高端定制方案，5-卫浴个性空间案例库，6-淋浴房空间案例库
                            id:
                              type: string
                              description: 主键ID
                            imagePath:
                              type: string
                              description: “不限”选项的封面图
                            isDelete:
                              type: integer
                              format: int32
                              description: 是否删除
                            modify:
                              type: string
                              description: 修改人
                            modifyDate:
                              type: string
                              description: 修改时间
                            organId:
                              type: string
                              description: 机构ID
                            sortNo:
                              type: integer
                              format: int32
                              description: 排序
                            tags:
                              type: array
                              items:
                                type: object
                                properties:
                                  createDate:
                                    type: string
                                    description: 创建时间
                                  creator:
                                    type: string
                                    description: 创建人
                                  id:
                                    type: string
                                    description: 标签ID
                                  imagePath:
                                    type: string
                                    description: 标签图片
                                  modify:
                                    type: string
                                    description: 修改人
                                  modifyDate:
                                    type: string
                                    description: 修改时间
                                  organId:
                                    type: string
                                    description: 机构ID
                                  sortNo:
                                    type: integer
                                    format: int32
                                    description: 排序
                                  tagName:
                                    type: string
                                    description: 标签名称
                                  tagStatus:
                                    type: string
                                    description: 标签状态
                                  tenantId:
                                    type: string
                                    description: tenantId租户id(兼容)
                              description: 标签表OutputDto
                        description: 标签分组结果
              example:
                msg: ''
                code: 0
                data:
                  recordCount: 0
                  pageSize: 0
                  result:
                  - creator: ''
                    groupType: 0
                    modifyDate: ''
                    imagePath: ''
                    isDelete: 0
                    groupStatus: ''
                    tags:
