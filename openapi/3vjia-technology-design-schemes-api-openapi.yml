      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                area:
                  type: string
                  description: 面积范围（31-40㎡、41-50㎡....）的分类ID
                createBeginTime:
                  type: string
                  description: 方案创建开始时间，格式yyyy-MM-ddHH:mm:ss,默认值10天前，createBeginTime和createEndTime的时间差不能超过90天
                createEndTime:
                  type: string
                  description: 方案创建结束时间，格式yyyy-MM-ddHH:mm:ss,默认当前时间，createBeginTime和createEndTime的时间差不能超过90天
                deptId:
                  type: string
                  description: 部门id
                houseType:
                  type: string
                  description: 户型（一居室、两居室....）的分类ID
                isEnable:
                  type: integer
                  format: int32
                  description: 查询账号有使用权限的方案（0=无使用权，1=有使用权）
                keyword:
                  type: string
                  description: 关键字，模糊搜索方案名称和方案ID
                kinds:
                  type: string
                  description: 品类（生活创意类、家具类....）的分类ID
                modifyBeginTime:
                  type: string
                  description: 方案修改开始时间，格式yyyy-MM-ddHH:mm:ss,modifyBeginTime和modifyEndTime之间的时间差不能超过90天
                modifyEndTime:
                  type: string
                  description: 方案修改结束时间，格式yyyy-MM-ddHH:mm:ss,modifyBeginTime和modifyEndTime之间的时间差不能超过90天
                orderBy:
                  type: string
                  description: "排序方式：MODIFY_TIME_DESC 按更新时间倒序，MODIFY_TIME_ASC 按更新时间正序，CREATE_TIME_DESC 创建时间倒序，CREATE_TIME_ASC 按创建时间正序\tCREATE_TIME_DESC"
                outUserId:
                  type: string
                  description: 绑定过三维家账号的企业系统的用户ID，当userId、userName为空时，outUserId有效
                pageIndex:
                  type: integer
                  format: int32
                  description: 页码，最小值为1，默认值为1
                pageSize:
                  type: integer
                  format: int32
                  description: 分页大小，最小值1，最大值500，默认值50
                publishState:
                  type: integer
                  format: int32
                  description: 发布状态（0=未发布，1=已发布，不传查全部）
                roomShape:
                  type: string
                  description: 房间形状（矩型、L型....）的分类ID
                roomType:
                  type: string
                  description: 空间类型（主卧、客厅....）的分类ID
                style:
                  type: string
                  description: 风格（现代、简约、欧式....）的分类ID
                userId:
                  type: string
                  description: 三维家用户ID，若传了userId，当忽略userName、outUserId字段
                userName:
                  type: string
                  description: 三维家账号，当userId为空时，userName有效，传了userName将忽略outUserId字段
