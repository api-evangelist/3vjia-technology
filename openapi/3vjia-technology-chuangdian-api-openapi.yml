      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      current:
                        type: integer
                        format: int64
                        description: 当前查询第几页
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            bizDesc:
                              type: string
                              description: 业务描述
                            consumeQuantity:
                              type: number
                              format: bigdecimal
                              description: 消费数量
                            consumeStatus:
                              type: integer
                              format: int32
                              description: 消费状态：0-预扣，1-已消费，2-已回滚
                            createTime:
                              type: string
                              format: date-time
                              description: 消费时间
                            id:
                              type: integer
                              format: int64
                              description: 消费记录ID
                            moduleName:
                              type: string
                              description: 模块名称
                            productName:
                              type: string
                              description: 产品名称
                            recordTransactionId:
                              type: string
                              description: 消费流水号
                            userName:
                              type: string
                              description: 消费账号
                        description: 分页记录
                      size:
                        type: integer
                        format: int64
                        description: 当前查询页记录数
                      total:
                        type: integer
                        format: int64
                        description: 总数
                    required:
                    - current
                    - size
                    - total
              example:
                msg: ''
                code: 0
                data:
                  records:
                  - bizDesc: ''
                    recordTransactionId: ''
                    moduleName: ''
                    consumeQuantity: 0
                    userName: ''
                    consumeStatus: 0
                    productName: ''
                    createTime: ''
                    id: 0
                  current: 0
                  total: 0
                  size: 0
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/compute/distributeRecord/distributeBatch:
    post:
      operationId: apiV1ComputeDistributeRecordDistributeBatch
      summary: 批量分配创点并返回分配记录ID及目标账号标识
      tags:
      - Chuangdian
      x-source-documentation: https://dev.3vjia.com/document?apiId=869963409867821164
      x-documentation-category: 创点系统
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountType:
                  type: string
                  description: 接收账号类型：person或shop
                accountTypeId:
                  type: string
                  description: 接收账号ID：个人账号传用户ID，门店账号传门店ID
                computeAccountDetailId:
                  type: integer
                  format: int64
                  description: 来源账号明细ID
                distributedQuantity:
                  type: number
                  format: bigdecimal
                  description: 分配数量
              required:
              - accountType
              - accountTypeId
              - computeAccountDetailId
              - distributedQuantity
            example:
            - accountType: ''
              accountTypeId: ''
              computeAccountDetailId: 0
              distributedQuantity: 0
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      accountType:
                        type: string
                        description: 接收账号类型：person或shop
                      accountTypeId:
                        type: string
                        description: 接收账号类型对应ID：用户ID或门店ID
                      distributeRecordId:
                        type: integer
                        format: int64
                        description: 分配记录ID
              example:
                msg: ''
                code: 0
                data:
                - accountType: ''
                  distributeRecordId: 0
                  accountTypeId: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/compute/distributeRecord/pageDetail:
    post:
      operationId: apiV1ComputeDistributeRecordPageDetail
      summary: 分页查询当前租户分配结果
      tags:
      - Chuangdian
      x-source-documentation: https://dev.3vjia.com/document?apiId=869963409867821166
      x-documentation-category: 创点系统
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountName:
                  type: string
                  description: 接收账号名称，精确匹配
                accountType:
                  type: string
                  description: 接收账号类型：person或shop
                accountTypeId:
                  type: string
                  description: 接收账号类型对应ID：用户ID或门店ID
                creator:
                  type: string
                  description: 操作人账号，精确匹配
                current:
                  type: integer
                  format: int64
                  description: 当前查询第几页
                distributeEndTime:
                  type: string
                  format: date-time
                  description: 分配结束时间
                distributeRecordId:
                  type: integer
                  format: int64
                  description: 分配记录ID
                distributeStartTime:
                  type: string
                  format: date-time
                  description: 分配开始时间
                likeAccountName:
                  type: string
                  description: 接收账号名称，模糊匹配
                likeCreator:
                  type: string
                  description: 操作人账号，模糊匹配
                shopId:
                  type: string
                  description: 门店ID
                size:
                  type: integer
                  format: int64
                  description: 当前查询页记录数
                status:
                  type: integer
                  format: int32
                  description: 状态：0-已完成，1-已回收
                userId:
                  type: string
                  description: 用户ID，仅查询目标为该个人账号的分配记录
              required:
