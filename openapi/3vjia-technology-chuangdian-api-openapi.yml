              - size
            example:
              creator: ''
              accountName: ''
              likeCreator: ''
              accountType: ''
              likeAccountName: ''
              distributeRecordId: 0
              userId: ''
              distributeEndTime: ''
              current: 0
              accountTypeId: ''
              size: 0
              shopId: ''
              distributeStartTime: ''
              status: 0
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      current:
                        type: integer
                        format: int64
                        description: 当前查询第几页
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            accountName:
                              type: string
                              description: 接收账号名称
                            accountType:
                              type: string
                              description: 接收账号类型：person或shop
                            accountTypeId:
                              type: string
                              description: 接收账号类型对应ID：用户ID或门店ID
                            createTime:
                              type: string
                              format: date-time
                              description: 分配时间
                            creator:
                              type: string
                              description: 操作人
                            currentQuantity:
                              type: number
                              format: bigdecimal
                              description: 目标创点明细当前剩余数量
                            distributedQuantity:
                              type: number
                              format: bigdecimal
                              description: 分配数量
                            expirationTime:
                              type: string
                              format: date-time
                              description: 到期时间
                            id:
                              type: integer
                              format: int64
                              description: 分配记录ID
                            modifyTime:
                              type: string
                              format: date-time
                              description: 修改时间
                            sourceComputeAccountDetailId:
                              type: integer
                              format: int64
                              description: 来源创点明细ID
                            sourceComputeAccountId:
                              type: integer
                              format: int64
                              description: 来源创点账号ID
                            status:
                              type: integer
                              format: int32
                              description: 状态：0-已完成，1-已回收
                            targetComputeAccountDetailId:
                              type: integer
                              format: int64
                              description: 分配产生的目标创点明细ID
                        description: 分页记录
                      size:
                        type: integer
                        format: int64
                        description: 当前查询页记录数
                      total:
                        type: integer
                        format: int64
                        description: 总数
                    required:
                    - current
                    - size
                    - total
              example:
                msg: ''
                code: 0
                data:
                  records:
                  - creator: ''
                    distributedQuantity: 0
                    accountName: ''
                    targetComputeAccountDetailId: 0
                    accountType: ''
                    accountTypeId: ''
                    modifyTime: ''
                    createTime: ''
                    expirationTime: ''
                    sourceComputeAccountDetailId: 0
                    id: 0
