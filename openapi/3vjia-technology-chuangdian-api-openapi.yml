openapi: 3.2.0
info:
  title: 3vjia Open Platform Chuangdian API
  version: '2026-09-05'
  summary: Home-furnishing 3D cloud design, quotation, order, manufacturing (AIMES/MOS/DMS) and AI operations exposed by the 3vjia (三维家) Open Platform.
  description: Machine-readable description of the 3vjia (三维家 / AiHouse) Open Platform, DERIVED — not published by the provider in this form.
  contact:
    name: 3vjia Open Platform
    url: https://dev.3vjia.com/
servers:
- url: https://open-gateway.3vjia.com
  description: 3vjia Open Platform gateway (current)
- url: https://open.3vjia.com
  description: Legacy open gateway — takes ?sysCode=external&access_token=
security:
- oauth2ClientCredentials: []
tags:
- name: Chuangdian
  description: 创点系统
paths:
  /api/v1/compute/account/quantityStatistics:
    post:
      operationId: apiV1ComputeAccountQuantityStatistics
      summary: 查询指定账号自身创点数量统计
      tags:
      - Chuangdian
      x-source-documentation: https://dev.3vjia.com/document?apiId=869961899935158340
      x-documentation-category: 创点系统
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountType:
                  type: string
                  description: 账号类型(person-个人|shop-门店|organ-企业)
                accountTypeId:
                  type: string
                  description: 账号类型对应Id(用户Id|门店Id|租户Id)
              required:
              - accountType
              - accountTypeId
            example:
              accountType: ''
              accountTypeId: ''
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      accountType:
                        type: string
                        description: 账号类型
                      accountTypeId:
                        type: string
                        description: 账号类型对应Id
                      accountTypeName:
                        type: string
                        description: 账号名称
                      computeAccountId:
                        type: integer
                        format: int64
                        description: 创点账号主键Id
                      confirmedConsumeQuantity:
                        type: number
                        format: bigdecimal
                        description: 实扣消费数量
                      consumeQuantity:
                        type: number
                        format: bigdecimal
                        description: 消费总数：等于预扣消费数量与实扣消费数量之和
                      distributedQuantity:
                        type: number
                        format: bigdecimal
                        description: 分配数量
                      originalQuantity:
                        type: number
                        format: bigdecimal
                        description: 原始数量
                      preConsumeQuantity:
                        type: number
                        format: bigdecimal
                        description: 预扣消费数量
                      remainingQuantity:
                        type: number
                        format: bigdecimal
                        description: 剩余数量
              example:
                msg: ''
                code: 0
                data:
                  remainingQuantity: 0
                  distributedQuantity: 0
                  originalQuantity: 0
                  accountType: ''
                  preConsumeQuantity: 0
                  accountTypeName: ''
                  consumeQuantity: 0
                  accountTypeId: ''
                  computeAccountId: 0
                  confirmedConsumeQuantity: 0
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/compute/accountDetail/allocatablePage:
    post:
      operationId: apiV1ComputeAccountDetailAllocatablePage
      summary: 分页查询可分配创点账号明细
      tags:
      - Chuangdian
      x-source-documentation: https://dev.3vjia.com/document?apiId=869962655010541650
      x-documentation-category: 创点系统
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current:
                  type: integer
                  format: int64
                  description: 当前查询第几页
                size:
                  type: integer
                  format: int64
                  description: 当前查询页记录数
                sort:
                  type: array
                  items:
                    type: object
                    properties:
                      ascending:
                        type: boolean
                        description: 字段排序规则
                      normalized:
                        type: boolean
                        description: 是否已经规范化，即字段名与数据库字段已经一致，false的时候会将驼峰转下划线
                      property:
                        type: string
                        description: 根据哪个字段进行排序
                  description: 排序定义
              required:
              - current
              - size
            example:
              sort:
              - normalized: false
                ascending: false
                property: ''
              current: 0
              size: 0
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      current:
                        type: integer
                        format: int64
                        description: 当前查询第几页
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            accountType:
                              type: string
                              description: 账号类型
                            accountTypeId:
                              type: string
                              description: 账号类型对应Id
                            accountTypeName:
                              type: string
                              description: 账号名称
                            computeAccountDetailId:
                              type: integer
                              format: int64
                              description: 账户明细ID
                            expirationTime:
                              type: string
                              format: date-time
                              description: 到期时间
                            remainingQuantity:
                              type: number
                              format: bigdecimal
                              description: 剩余可分配数量
                        description: 分页记录
                      size:
                        type: integer
                        format: int64
                        description: 当前查询页记录数
                      total:
                        type: integer
                        format: int64
                        description: 总数
                    required:
                    - current
                    - size
                    - total
              example:
                msg: ''
                code: 0
                data:
                  records:
                  - remainingQuantity: 0
                    accountType: ''
                    accountTypeName: ''
                    accountTypeId: ''
                    computeAccountDetailId: 0
                    expirationTime: ''
                  current: 0
                  total: 0
                  size: 0
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/compute/consumeRecord/listByRecordTransactionIds:
    post:
      operationId: apiV1ComputeConsumeRecordListByRecordTransactionIds
      summary: 根据流水号批量查询消费记录
      tags:
      - Chuangdian
      x-source-documentation: https://dev.3vjia.com/document?apiId=864932006767775811
      x-documentation-category: 创点系统
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recordTransactionIds:
                  type: array
                  items: {}
                  description: 消费流水号列表
              required:
              - recordTransactionIds
            example:
              recordTransactionIds: []
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      bizDesc:
                        type: string
                        description: 消耗备注
                      consumeQuantity:
                        type: number
                        format: bigdecimal
                        description: 消耗数量
                      consumeStatus:
                        type: integer
                        format: int32
                        description: '消耗状态: 0-预扣, 1-已消费, 2-已回滚'
                      createTime:
                        type: string
                        format: date-time
                        description: 消耗时间
                      moduleName:
                        type: string
                        description: 模块名称
                      productName:
                        type: string
                        description: 产品名称
                      recordTransactionId:
                        type: string
                        description: 消费流水号
                      userName:
                        type: string
                        description: 消费账号
              example:
                msg: ''
                code: 0
                data:
                - bizDesc: ''
                  recordTransactionId: ''
                  moduleName: ''
                  consumeQuantity: 0
                  userName: ''
                  consumeStatus: 0
                  productName: ''
                  createTime: ''
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/compute/consumeRecord/pageDetail:
