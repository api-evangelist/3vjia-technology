  /api/v1/compute/personalConsumeStatistics:
    post:
      operationId: apiV1ComputePersonalConsumeStatistics
      summary: 根据用户id集合查询用户消费创点统计
      tags:
      - Chuangdian
      x-source-documentation: https://dev.3vjia.com/document?apiId=869964919968256071
      x-documentation-category: 创点系统
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items: {}
                  description: 用户Id集合
              required:
              - userIds
            example:
              userIds: []
      responses:
        '200':
          description: 成功 / OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 请求是否成功 / whether the call succeeded
                  code:
                    type: integer
                    description: 结果码 / result code (0 = success)
                  msg:
                    type: string
                    description: 提示信息 / message
                  data:
                    type: object
                    properties:
                      accountConsumes:
                        type: array
                        items:
                          type: object
                          properties:
                            accountType:
                              type: string
                              description: 实际扣款账号类型
                            accountTypeId:
                              type: string
                              description: 实际扣款账号类型对应Id
                            accountTypeName:
                              type: string
                              description: 实际扣款账号名称
                            computeAccountId:
                              type: integer
                              format: int64
                              description: 实际扣款创点账号主键Id
                            confirmedConsumeQuantity:
                              type: number
                              format: bigdecimal
                              description: 从该账号实扣的创点数量
                            consumeQuantity:
                              type: number
                              format: bigdecimal
                              description: 从该账号消费的创点总数：等于预扣消费数量与实扣消费数量之和
                            preConsumeQuantity:
                              type: number
                              format: bigdecimal
                              description: 从该账号预扣的创点数量
                            userId:
                              type: string
                              description: 消费用户Id
                        description: 按实际扣款账号分组的消费明细
                      confirmedConsumeQuantity:
                        type: number
                        format: bigdecimal
                        description: 个人实扣消费创点总数
                      consumeQuantity:
                        type: number
                        format: bigdecimal
                        description: 个人消费创点总数：等于预扣消费数量与实扣消费数量之和
                      preConsumeQuantity:
                        type: number
                        format: bigdecimal
                        description: 个人预扣消费创点总数
                      userId:
                        type: string
                        description: 用户Id
              example:
                msg: ''
                code: 0
                data:
                - preConsumeQuantity: 0
                  consumeQuantity: 0
                  userId: ''
                  accountConsumes:
                  - accountType: ''
                    preConsumeQuantity: 0
                    accountTypeName: ''
                    consumeQuantity: 0
                    userId: ''
                    accountTypeId: ''
                    computeAccountId: 0
                    confirmedConsumeQuantity: 0
                  confirmedConsumeQuantity: 0
                success: false
        '401':
          description: access_token 缺失或已过期 / missing or expired access_token
  /api/v1/compute/tenantQuantityStatistics:
    post:
      operationId: apiV1ComputeTenantQuantityStatistics
      summary: 查询整个机构全部账号创点数量汇总
      tags:
      - Chuangdian
      x-source-documentation: https://dev.3vjia.com/document?apiId=869961899935158338
      x-documentation-category: 创点系统
