gaps_for_an_agent:
- No MCP server, so an agent must call the HTTP API directly with an enterprise token.
- Failures are HTTP 200 with the outcome in the body — an agent must branch on body.success, never status.
- No idempotency, so a retried write is a genuine double-fire risk.
- All operation summaries and field descriptions are Chinese-only.
